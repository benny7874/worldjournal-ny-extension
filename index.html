<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden}
body{display:flex;flex-direction:column;align-items:center}

.pageImage{display:block;width:auto;max-width:100%;height:auto;min-height:1px;margin:0 auto;transform-origin:center center;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;will-change:transform}
#loading,#errorMessage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;z-index:90}
#loading{display:none;background:#1e1e1ee6;padding:12px 20px;border-radius:10px;font-size:16px;z-index:100}
#errorMessage{display:none;width:80%;max-width:400px;background:#282828f5;padding:20px;border-radius:12px;white-space:pre-wrap}
#controls{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:#191919eb;box-shadow:0 4px 20px #0008;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}

#appVersion{min-width:50px;text-align:center;font-size:13px;color:#aaa}

#preloadStatus{min-width:78px;text-align:center;font-size:14px;color:#ddd}
#datePanel,#pagePanel{position:fixed;left:50%;bottom:calc(75px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:none;max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#191919f5;border-radius:14px;padding:10px;box-shadow:0 4px 25px #0009}
#datePanel{width:min(90vw,330px);max-height:min(70vh,520px)}

.dateButton:active,.pageButton:active{background:#666}
</style></head><body>

<div id="viewer"><div id="pageTrack"></div></div>
<div id="loading">載入報紙…</div>
<div id="errorMessage"></div>
<div id="datePanel"></div>
<div id="pagePanel"></div>
<div id="controls">
<span id="appVersion">v1.0.35-F9</span>
<span id="preloadStatus">預載 0%</span>
<button class="controlButton" id="dateButton">09/30/2026</button>
<button class="controlButton" id="previousButton">‹</button>
<span id="pageNumber" role="button" tabindex="0">A01 / 40</span>
<button class="controlButton" id="nextButton">›</button>
</div>

<script>
const DAYS=7,URL="https://www.worldjournal.com/datafeed/wj/ny/NY-",CON=4,DT=350,DD=30,SW=80,WT=70,WG=650,Z=1.05,STEP=480,ZA=2000,KA=2000,$=id=>document.getElementById(id),viewer=$("viewer"),track=$("pageTrack"),loading=$("loading"),error=$("errorMessage"),controls=$("controls"),dateBtn=$("dateButton"),prev=$("previousButton"),num=$("pageNumber"),next=$("nextButton"),status=$("preloadStatus"),datePanel=$("datePanel"),pagePanel=$("pagePanel");

let d="",pages=[],currentPage=0,pageImage=null,zoom=1,offsetX=0,offsetY=0,tSX=0,tSY=0,tOX=0,tOY=0,tUI=0,tMoved=0,pinchDistance=0,pinchStartZoom=1,pinchStartOffsetX=0,pinchStartOffsetY=0,pinchStartX=0,pinchStartY=0,lastTapTime=0,lastTapX=0,lastTapY=0,controlsVisible=0,gen=0,total=0,done=0,failed=0,clickTimer=null,suppress=0,zoomScroll=0,zoomTimer=null,keyFrame=null,panFrame=null,panTargetX=0,panTargetY=0,wheelDX=0,wheelLock=0,wheelTimer=null,touchVX=0,touchVY=0,touchLastX=0,touchLastY=0,touchLastTime=0,inertiaFrame=null,scrollVY=0,scrollLastY=0,scrollLastTime=0,scrollInertiaFrame=null,scrollSamples=[],scrollFrame=null,scrollTargetY=0,scrollTouchActive=0;

const cache=new Set(),
fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`,
disp=s=>{let[,m,n]=s.split("-");return`${+m}/${+n}`},
loadShow=v=>loading.style.display=v?"block":"none",
hideErr=()=>error.style.display="none",
showErr=s=>(error.textContent=s,error.style.display="block"),
saved=x=>{let n=parseInt(localStorage.getItem(`worldjournal-page-${x}`),10);return isNaN(n)||n<0?0:n},
save=()=>d&&localStorage.setItem(`worldjournal-page-${d}`,currentPage),
fb=(x,p)=>`https://pgw.worldjournal.com/gw/wj.php?u=NY/${x.replaceAll("-","")}/NY${x.replaceAll("-","")}${p}`,
normal=x=>typeof x==="string"?x.replace(/&size=S(?=&|$)/,""):"";

function preloadOne(p,g,x){
 return new Promise(r=>{
  let i=new Image(),a=p.imageUrl,b=p.fallbackImageUrl,q=0;
  i.referrerPolicy="no-referrer";
  i.onload=()=>{
   if(q)return;
   q=1;
   if(g===gen){cache.add(`${x}-${p.pageId}`);done++;upd(g)}
   r(1)
  };
  i.onerror=()=>{
   if(q)return;
   if(!q++&&a!==b){i.src=b;return}
   q=1;
   if(g===gen){failed++;upd(g)}
   r(0)
  };
  i.src=a
 })
}

function upd(g){
 if(g!==gen)return;
 if(!total){status.textContent="預載 0%";return}
 let n=done+failed,p=Math.min(100,Math.round(n/total*100));
 status.textContent=n>=total?(failed?`預載 ${p}%（${failed}失敗）`:"預載 100%"):`預載 ${p}%`
}

function preload(x,list){
 let g=++gen;
 total=list.length;
 done=failed=0;
 upd(g);
 let q=list.slice(),ci=q.findIndex(p=>p.pageId===list[currentPage]?.pageId);
 if(ci>0){let a=q.splice(ci,1)[0];q.unshift(a)}
 q=q.filter(p=>!cache.has(`${x}-${p.pageId}`));
 done=list.length-q.length;
 upd(g);
 let i=0;
 async function w(){while(i<q.length)await preloadOne(q[i++],g,x)}
 for(let n=0;n<Math.min(CON,q.length);n++)w()
}

function image(p,current){
 let i=document.createElement("img");
 i.className="pageImage";
 i.alt="世界日報";
 i.draggable=false;
 i.referrerPolicy="no-referrer";
 i.loading=current?"eager":"lazy";
 if(!p)return i;
 i.dataset.retry=0;
 i.onload=()=>{
  if(current){
   hideErr();
   if(isZoom())transform()
  }
 };
 i.onerror=()=>{
  if(!+i.dataset.retry&&p.fallbackImageUrl!==p.imageUrl){
   i.dataset.retry=1;
   i.src=p.fallbackImageUrl
  }else if(current)showErr("圖片載入失敗，請稍後再試。")
 };
 i.src=p.imageUrl;
 return i
}

function render(){
 track.innerHTML="";
 pageImage=null;
 let s=document.createElement("div"),i=image(pages[currentPage],1);
 s.className="pageSlot";
 s.dataset.page=currentPage;
 s.appendChild(i);
 track.appendChild(s);
 pageImage=i;
 requestAnimationFrame(()=>isZoom()&&transform())
}

function showPage(){
 if(!pages.length)return;
 stopZA();
 stopKA();
 stopPan();
 stopInertia();
 stopScrollInertia();
 resetZoom();
 num.textContent=`${pages[currentPage].pageId} / ${pages.length}`;
 render();
 updatePanel();
 scrollTo(0,0);
 save()
}

async function load(x){
 loadShow(1);
 hideErr();
 try{
  let r=await fetch(URL+x+".json",{cache:"no-store"});
  if(!r.ok)throw Error(`HTTP ${r.status}`);
  let a=await r.json();
  if(!Array.isArray(a))throw Error("資料格式不正確");
  a=a.filter(x=>typeof x.page_id==="string"&&/^[ABCD]\d{2}$/.test(x.page_id)).sort((a,b)=>a.page_id.localeCompare(b.page_id));
  if(!a.length)throw Error("這一天沒有 A/B/C 報紙");
  pages=a.map(p=>{
   let id=p.page_id,f=fb(x,id);
   return{pageId:id,pageName:p.page_name||"",imageUrl:normal(p.image_path)||f,fallbackImageUrl:f}
  });
  d=x;
  currentPage=Math.min(saved(x),pages.length-1);
  buildDate();
  buildPage();
  showPage();
  dateBtn.textContent=x.slice(5,7)+"/"+x.slice(8,10)+"/"+x.slice(0,4);
  loadShow(0);
  preload(x,pages);
  return 1
 }catch(e){
  loadShow(0);
  showErr(`資料載入失敗\n${x}：${e?.message||e}`);
  return 0
 }
}

async function latest(){
 let t=new Date;
 for(let n=0;n<DAYS;n++){
  let x=new Date(t);
  x.setDate(t.getDate()-n);
  if(await load(fmt(x)))return
 }
 showErr("目前無法取得世界日報資料。")
}

function isZoom(){return zoom>1.001}

function lock(){
 zoomScroll=scrollY;
 document.documentElement.style.overflowY=document.body.style.overflowY="hidden"
}

function unlock(){
 document.documentElement.style.overflowY=document.body.style.overflowY=""
}

function center(){
 let r=pageImage?.parentElement?.getBoundingClientRect();
 return r?{x:r.left+r.width/2,y:r.top+(pageImage.offsetTop||0)+pageImage.offsetHeight/2}:{x:innerWidth/2,y:-scrollY}
}

function bounds(){
 if(!pageImage||!isZoom())return{minX:0,maxX:0,minY:0,maxY:0};
 let w=pageImage.offsetWidth,h=pageImage.offsetHeight,c=center(),sw=w*zoom,sh=h*zoom;
 let minX=innerWidth-c.x-sw/2,maxX=-c.x+sw/2;
 let minY=innerHeight-c.y-sh/2,maxY=-c.y+sh/2;
 if(minX>maxX)minX=maxX=innerWidth/2-c.x;
 if(minY>maxY)minY=maxY=innerHeight/2-c.y;
 return{minX,maxX,minY,maxY}
}

function clamp(){
 if(!isZoom()){
  zoom=1;
  offsetX=offsetY=0;
  return
 }
 let b=bounds();
 offsetX=Math.max(b.minX,Math.min(b.maxX,offsetX));
 offsetY=Math.max(b.minY,Math.min(b.maxY,offsetY))
}

function transform(){
 viewer.classList.toggle("zoomed",isZoom());
 clamp();
 if(pageImage)pageImage.style.transform=`translate3d(${offsetX}px,${offsetY}px,0) scale(${zoom})`
}

function stopPan(){
 if(panFrame){
  cancelAnimationFrame(panFrame);
  panFrame=null
 }
 panTargetX=offsetX;
 panTargetY=offsetY
}

function queuePanTo(x,y){
 panTargetX=x;
 panTargetY=y;
 if(panFrame)return;
 panFrame=requestAnimationFrame(()=>{
  panFrame=null;
  offsetX=panTargetX;
  offsetY=panTargetY;
  transform()
 })
}

function queuePanBy(dx,dy){
 if(!isZoom())return;
 if(!panFrame){
  panTargetX=offsetX;
  panTargetY=offsetY
 }
 panTargetX+=dx;
 panTargetY+=dy;
 if(panFrame)return;
 panFrame=requestAnimationFrame(()=>{
  panFrame=null;
  offsetX=panTargetX;
  offsetY=panTargetY;
  transform()
 })
}

function stopInertia(){
 if(inertiaFrame){
  cancelAnimationFrame(inertiaFrame);
  inertiaFrame=null
 }
 touchVX=0;
 touchVY=0
}

function startInertia(){
 if(!isZoom())return;
 if(Math.hypot(touchVX,touchVY)<.05)return;

 let vx=touchVX,
 vy=touchVY,
 last=performance.now();

 const frame=now=>{
  if(!isZoom()){
   inertiaFrame=null;
   return
  }

  let dt=Math.min(32,now-last);
  last=now;

  let oldX=offsetX,
  oldY=offsetY;

  offsetX+=vx*dt;
  offsetY+=vy*dt;
  transform();

  if(Math.abs(offsetX-oldX)<.001&&Math.abs(offsetY-oldY)<.001){
   inertiaFrame=null;
   touchVX=touchVY=0;
   return
  }

  let friction=Math.exp(-.0042*dt);
  vx*=friction;
  vy*=friction;

  if(Math.hypot(vx,vy)<.03){
   inertiaFrame=null;
   touchVX=touchVY=0;
   return
  }

  inertiaFrame=requestAnimationFrame(frame)
 };

 inertiaFrame=requestAnimationFrame(frame)
}

function stopScrollInertia(){
 if(scrollInertiaFrame){
  cancelAnimationFrame(scrollInertiaFrame);
  scrollInertiaFrame=null
 }

 if(scrollFrame){
  cancelAnimationFrame(scrollFrame);
  scrollFrame=null
 }

 scrollVY=0;
 scrollLastY=0;
 scrollLastTime=0;
 scrollSamples=[];
 scrollTouchActive=0
}

function queueScrollTo(y){
 scrollTargetY=y;

 if(scrollFrame)return;

 scrollFrame=requestAnimationFrame(()=>{
  scrollFrame=null;

  if(!scrollTouchActive||isZoom())return;

  let max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
  let target=Math.max(0,Math.min(max,scrollTargetY));

  if(Math.abs(scrollY-target)>0.01)scrollTo(0,target)
 })
}

function startScrollInertia(){

 if(isZoom())return;

 /*
  F9：
  使用最近 100ms 的觸控歷史估算鬆手瞬間速度。
  相比 F8 的 80ms，對慢速／短距離滑動更穩定。
 */
 if(scrollSamples.length>=2){

  let last=scrollSamples[scrollSamples.length-1],
  first=last;

  for(let i=scrollSamples.length-2;i>=0;i--){

   if(last.t-scrollSamples[i].t<=100){
    first=scrollSamples[i]
   }else{
    break
   }
  }

  let dt=last.t-first.t;

  if(dt>0){
   scrollVY=(last.y-first.y)/dt
  }
 }

 /*
  F9：
  不再用 .012 作為實際可感知慣性的硬門檻。
  只要還有極小的速度，就允許短尾巴存在。
 */
 if(Math.abs(scrollVY)<.002){
  scrollVY=0;
  return
 }

 let vy=scrollVY,
 last=performance.now();

 const frame=now=>{

  if(isZoom()){
   scrollInertiaFrame=null;
   scrollVY=0;
   return
  }

  let dt=Math.min(32,now-last);
  last=now;

  let max=Math.max(0,document.documentElement.scrollHeight-innerHeight),
  old=scrollY,
  target=old-vy*dt;

  target=Math.max(0,Math.min(max,target));
  scrollTo(0,target);

  if(Math.abs(scrollY-old)<.01){
   scrollInertiaFrame=null;
   scrollVY=0;
   return
  }

  /*
   保留 F7/F8 已經驗證過的摩擦力。
  */
  vy*=Math.exp(-.0018*dt);

  if(Math.abs(vy)<.002){
   scrollInertiaFrame=null;
   scrollVY=0;
   return
  }

  scrollInertiaFrame=requestAnimationFrame(frame)
 };

 scrollInertiaFrame=requestAnimationFrame(frame)
}

function stopZA(){
 if(zoomTimer){
  clearTimeout(zoomTimer);
  zoomTimer=null
 }
 if(pageImage)pageImage.style.transition=""
}

function stopKA(){
 if(keyFrame){
  cancelAnimationFrame(keyFrame);
  keyFrame=null
 }
}

function finishWheel(){
 wheelDX=0;
 wheelLock=0;
 wheelTimer=null
}

function stopWheel(){
 wheelDX=0;
 wheelLock=0;
 if(wheelTimer){
  clearTimeout(wheelTimer);
  wheelTimer=null
 }
}

function armWheelRelease(){
 clearTimeout(wheelTimer);
 wheelTimer=setTimeout(finishWheel,WG)
}

function resetZoom(){
 stopZA();
 stopPan();
 stopInertia();
 stopScrollInertia();
 zoom=1;
 offsetX=offsetY=0;
 unlock();
 transform()
}

function resetInteraction(){
 stopZA();
 stopKA();
 stopPan();
 stopInertia();
 stopScrollInertia();
 resetZoom()
}

function nz(z){return z<Z?1:z}

function setZoom(x,y,z,ani=0){
 let old=zoom,n=nz(Math.max(1,z));
 if(Math.abs(n-old)<.0001)return;
 stopKA();
 stopPan();
 stopInertia();
 stopScrollInertia();

 let c=center(),
 lx=(x-c.x-offsetX)/old,
 ly=(y-c.y-offsetY)/old;

 zoom=n;

 if(zoom===1){
  offsetX=offsetY=0;
  unlock()
 }else{
  offsetX=x-c.x-lx*zoom;
  offsetY=y-c.y-ly*zoom;
  lock()
 }

 if(ani&&pageImage){
  stopZA();
  pageImage.style.transition=`transform ${ZA}ms ease-in-out`;
  transform();
  zoomTimer=setTimeout(()=>{
   if(pageImage)pageImage.style.transition="";
   zoomTimer=null
  },ZA+50)
 }else transform()
}

function toggle(x,y,a=1){
 setZoom(x,y,zoom>1.001?1:1.5,a)
}

function enter(){
 setZoom(0,0,isZoom()?1:1.5,1)
}

function keyMove(type,amt){
 stopKA();
 stopPan();
 stopInertia();
 stopScrollInertia();

 let start=type==="scroll"?scrollY:type==="x"?offsetX:offsetY,
 target=start+amt;

 if(type==="scroll"){
  let max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
  target=Math.max(0,Math.min(max,target))
 }else{
  if(type==="x")offsetX=target;
  else offsetY=target;
  clamp();
  target=type==="x"?offsetX:offsetY;
  if(type==="x")offsetX=start;
  else offsetY=start
 }

 let begin=performance.now(),
 ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
 frame=now=>{
  let p=Math.min(1,(now-begin)/KA),
  v=start+(target-start)*ease(p);

  type==="scroll"?scrollTo(0,v):
  type==="x"?(offsetX=v,transform()):
  (offsetY=v,transform());

  if(p<1)keyFrame=requestAnimationFrame(frame);
  else keyFrame=null
 };

 keyFrame=requestAnimationFrame(frame)
}

function closePanels(){
 datePanel.classList.remove("visible");
 pagePanel.classList.remove("visible")
}

function commandNext(){
 if(currentPage>=pages.length-1)return;
 resetInteraction();
 currentPage++;
 showPage()
}

function commandPrev(){
 if(currentPage<=0)return;
 resetInteraction();
 currentPage--;
 showPage()
}

function buildDate(){
 datePanel.innerHTML="";
 let base=new Date;
 for(let n=0;n<DAYS;n++){
  let x=new Date(base);
  x.setDate(base.getDate()-n);
  let s=fmt(x),b=document.createElement("button");
  b.className="dateButton"+(s===d?" current":"");
  b.textContent=disp(s)+(n?"":"　今天");
  b.onclick=async e=>{
   e.stopPropagation();
   closePanels();
   if(s!==d){
    resetInteraction();
    save();
    await load(s)
   }
  };
  datePanel.appendChild(b)
 }
}

function buildPage(){
 pagePanel.innerHTML="";
 pages.forEach((p,n)=>{
  let b=document.createElement("button");
  b.className="pageButton"+(n===currentPage?" current":"");
  b.textContent=p.pageId+(p.pageName?`　${p.pageName}`:"");
  b.onclick=e=>{
   e.stopPropagation();
   resetInteraction();
   currentPage=n;
   pagePanel.classList.remove("visible");
   showPage()
  };
  pagePanel.appendChild(b)
 })
}

function updatePanel(){
 pagePanel.querySelectorAll(".pageButton").forEach((b,i)=>b.classList.toggle("current",i===currentPage))
}

dateBtn.onclick=e=>{
 e.stopPropagation();
 pagePanel.classList.remove("visible");
 datePanel.classList.toggle("visible")
};

num.onclick=e=>{
 e.stopPropagation();
 datePanel.classList.remove("visible");
 updatePanel();
 pagePanel.classList.toggle("visible")
};

num.onkeydown=e=>{
 if(e.key==="Enter"||e.key===" "){
  e.preventDefault();
  num.click()
 }
};

prev.onclick=e=>{
 e.stopPropagation();
 commandPrev()
};

next.onclick=e=>{
 e.stopPropagation();
 commandNext()
};

controls.onclick=e=>e.stopPropagation();
datePanel.onclick=pagePanel.onclick=e=>e.stopPropagation();

document.addEventListener("wheel",e=>{

 if(e.target.closest("#controls,#datePanel,#pagePanel"))return;

 if(isZoom()){

  if(e.cancelable)e.preventDefault();
  e.stopImmediatePropagation();

  if(scrollY!==zoomScroll)scrollTo(0,zoomScroll);

  queuePanBy(-e.deltaX,-e.deltaY);

  return
 }

 if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;

 if(e.cancelable)e.preventDefault();
 e.stopImmediatePropagation();

 if(wheelLock){
  armWheelRelease();
  return
 }

 wheelDX+=e.deltaX;

 if(Math.abs(wheelDX)>=WT){

  wheelLock=1;

  let direction=wheelDX>0?1:-1;

  wheelDX=0;

  if(direction>0)commandNext();
  else commandPrev();

  armWheelRelease()
 }

},{passive:false,capture:true});

document.addEventListener("keydown",e=>{
 if(e.target.closest("#controls,#datePanel,#pagePanel"))return;

 let k=e.key,c=e.code;

 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(k)){
  e.preventDefault();
  e.stopPropagation();

  if(isZoom()){
   keyMove(
    k==="ArrowLeft"||k==="ArrowRight"?"x":"y",
    (k==="ArrowLeft"||k==="ArrowUp"?1:-1)*STEP
   );
   return
  }

  if(k==="ArrowLeft")commandPrev();
  else if(k==="ArrowRight")commandNext();
  else keyMove("scroll",(k==="ArrowUp"?-1:1)*STEP);

  return
 }

 if(c==="Equal"){
  e.preventDefault();
  commandNext();
  return
 }

 if(c==="Minus"){
  e.preventDefault();
  commandPrev();
  return
 }

 if(c==="Enter"&&!e.repeat){
  e.preventDefault();
  enter()
 }
},{capture:true});

viewer.addEventListener("dblclick",e=>{
 if(e.target.closest("#controls,#datePanel,#pagePanel"))return;
 e.preventDefault();
 clearTimeout(clickTimer);
 suppress=Date.now()+600;
 toggle(e.clientX,e.clientY)
});

function tap(x,y){
 if(isZoom())return;

 let r=viewer.getBoundingClientRect(),
 p=(x-r.left)/r.width;

 p<.3?commandPrev():
 p>.7?commandNext():
 (
  controlsVisible=!controlsVisible,
  controls.classList.toggle("visible",controlsVisible),
  !controlsVisible&&closePanels()
 )
}

document.addEventListener("click",e=>{
 if(e.detail!==1)return;
 if(Date.now()<suppress){
  clearTimeout(clickTimer);
  return
 }
 if(e.target.closest("#controls,#datePanel,#pagePanel"))return;

 clearTimeout(clickTimer);

 if(controlsVisible){
  controlsVisible=0;
  controls.classList.remove("visible");
  closePanels();
  return
 }

 clickTimer=setTimeout(()=>{
  clickTimer=null;
  tap(e.clientX,e.clientY)
 },500)
});

function pinch(a,b){
 let dx=b.clientX-a.clientX,
 dy=b.clientY-a.clientY;
 return{
  d:Math.hypot(dx,dy),
  x:(a.clientX+b.clientX)/2,
  y:(a.clientY+b.clientY)/2
 }
}

document.addEventListener("touchstart",e=>{

 let t=e.target;

 tUI=!!t.closest("#controls,#datePanel,#pagePanel");

 if(tUI)return;

 tMoved=0;

 stopInertia();
 stopScrollInertia();

 if(e.touches.length>=2){

  let p=pinch(e.touches[0],e.touches[1]);

  pinchDistance=p.d;
  pinchStartZoom=zoom;
  pinchStartOffsetX=offsetX;
  pinchStartOffsetY=offsetY;
  pinchStartX=p.x;
  pinchStartY=p.y;
  lastTapTime=0;

  stopPan();

  return
 }

 let q=e.touches[0];

 tSX=q.clientX;
 tSY=q.clientY;
 tOX=offsetX;
 tOY=offsetY;

 touchLastX=q.clientX;
 touchLastY=q.clientY;
 touchLastTime=performance.now();
 touchVX=0;
 touchVY=0;

 if(!isZoom()){

  scrollLastY=q.clientY;
  scrollLastTime=performance.now();
  scrollVY=0;

  scrollSamples=[
   {y:q.clientY,t:performance.now()}
  ];

  scrollTargetY=scrollY;
  scrollTouchActive=1
 }

},{passive:true});

document.addEventListener("touchmove",e=>{

 if(tUI)return;

 if(e.touches.length>=2){

  if(e.cancelable)e.preventDefault();

  let p=pinch(e.touches[0],e.touches[1]);

  if(pinchDistance){

   let z=nz(Math.max(1,pinchStartZoom*p.d/pinchDistance)),
   r=viewer.getBoundingClientRect(),
   cx=r.left+r.width/2,
   cy=r.top+(pageImage.offsetTop||0)+pageImage.offsetHeight/2,
   lx=(pinchStartX-cx-pinchStartOffsetX)/pinchStartZoom,
   ly=(pinchStartY-cy-pinchStartOffsetY)/pinchStartZoom;

   zoom=z;

   zoom===1?
   (
    offsetX=offsetY=0,
    unlock()
   ):
   (
    offsetX=p.x-cx-lx*z,
    offsetY=p.y-cy-ly*z,
    lock()
   );

   transform()
  }

  tMoved=1;
  return
 }

 let q=e.touches[0];

 if(!q)return;

 let now=performance.now(),
 dx=q.clientX-tSX,
 dy=q.clientY-tSY;

 if(Math.abs(dx)>5||Math.abs(dy)>5)tMoved=1;

 if(isZoom()){

  let dt=now-touchLastTime;

  if(dt>0){
   let vx=(q.clientX-touchLastX)/dt,
   vy=(q.clientY-touchLastY)/dt;

   touchVX=touchVX*.65+vx*.35;
   touchVY=touchVY*.65+vy*.35;
  }

  touchLastX=q.clientX;
  touchLastY=q.clientY;
  touchLastTime=now;

  if(e.cancelable)e.preventDefault();

  queuePanTo(tOX+dx,tOY+dy);

  return
 }

 if(e.cancelable)e.preventDefault();

 let dt=now-scrollLastTime,
 deltaY=q.clientY-scrollLastY;

 if(dt>0){

  let vy=deltaY/dt;

  /*
   F9：
   保留即時速度作為輔助，但不讓單一 touchmove
   決定最終慣性。
  */
  scrollVY=scrollVY*.65+vy*.35;
 }

 scrollLastY=q.clientY;
 scrollLastTime=now;

 /*
  F9：
  觸控期間不再每個 touchmove 直接 scrollTo。
  先記住最新目標位置，再交給下一個 animation frame。
  這樣 Safari 如果短時間內送出多個 touchmove，
  就只繪製最新位置，減少「一卡一卡」的感覺。
 */
 let max=Math.max(0,document.documentElement.scrollHeight-innerHeight),
 target=scrollTargetY-deltaY;

 target=Math.max(0,Math.min(max,target));

 scrollTargetY=target;

 scrollSamples.push({
  y:q.clientY,
  t:now
 });

 while(scrollSamples.length>1&&now-scrollSamples[0].t>100){
  scrollSamples.shift()
 }

 queueScrollTo(target);

},{passive:false});

document.addEventListener("touchend",e=>{

 if(tUI){
  lastTapTime=0;
  return
 }

 if(e.touches.length){

  if(e.touches.length>=2){
   pinchDistance=pinch(e.touches[0],e.touches[1]).d
  }else if(pinchDistance){

   let q=e.touches[0];

   tSX=q.clientX;
   tSY=q.clientY;
   tOX=offsetX;
   tOY=offsetY;

   touchLastX=q.clientX;
   touchLastY=q.clientY;
   touchLastTime=performance.now();
   touchVX=0;
   touchVY=0
  }

  return
 }

 pinchDistance=0;
 stopPan();

 let q=e.changedTouches[0];

 if(!q)return;

 let now=Date.now(),
 dx=q.clientX-tSX,
 dy=q.clientY-tSY;

 if(!tMoved){

  let time=now-lastTapTime,
  dist=Math.hypot(q.clientX-lastTapX,q.clientY-lastTapY);

  if(time<DT&&dist<DD){

   clearTimeout(clickTimer);
   suppress=Date.now()+600;

   if(currentPage<pages.length-1)commandNext();

   lastTapTime=0;
   return
  }

  lastTapTime=now;
  lastTapX=q.clientX;
  lastTapY=q.clientY;

  clearTimeout(clickTimer);

  clickTimer=setTimeout(()=>{

   if(lastTapTime===now){

    lastTapTime=0;

    controlsVisible?
    (
     controlsVisible=0,
     controls.classList.remove("visible"),
     closePanels()
    ):
    tap(q.clientX,q.clientY)
   }

  },DT);

  return
 }

 lastTapTime=0;

 if(isZoom()){
  startInertia();
  return
 }

 /*
  F9：
  觸控結束時先把最後一個位置加入速度歷史，
  避免最後一小段速度沒有被 touchmove 捕捉到。
 */
 let endTime=performance.now();

 if(scrollTouchActive){

  scrollSamples.push({
   y:q.clientY,
   t:endTime
  });

  while(scrollSamples.length>1&&endTime-scrollSamples[0].t>100){
   scrollSamples.shift()
  }

  /*
   先確保手指最後位置已經真正顯示。
  */
  let max=Math.max(0,document.documentElement.scrollHeight-innerHeight),
  finalTarget=Math.max(0,Math.min(max,scrollY-(q.clientY-scrollLastY)));

  scrollTargetY=finalTarget;
  queueScrollTo(finalTarget);
 }

 scrollTouchActive=0;

 if(Math.abs(dy)>Math.abs(dx)*.7){
  startScrollInertia();
  return
 }

 if(Math.abs(dx)<SW||Math.abs(dx)<=Math.abs(dy))return;

 dx<0?commandNext():commandPrev()

});

document.addEventListener("touchcancel",()=>{
 pinchDistance=0;
 tMoved=1;
 lastTapTime=0;
 clearTimeout(clickTimer);
 suppress=0;
 stopPan();
 stopInertia();
 stopScrollInertia()
});

addEventListener("scroll",()=>{
 if(isZoom()&&Math.abs(scrollY-zoomScroll)>1)scrollTo(0,zoomScroll)
},{passive:true});

addEventListener("resize",()=>{
 if(isZoom())transform()
});

latest();
</script></body></html>
