<script>
/* =========================================================
   基本設定
   ========================================================= */
const DAYS_TO_KEEP = 7;
const DATA_URL =
    "https://www.worldjournal.com/datafeed/wj/ny/NY-";
const SECTION_ORDER = [
    "A",
    "B",
    "C",
    "D"
];
const PRELOAD_CONCURRENCY = 4;
/* =========================================================
   閱讀資料
   ========================================================= */
let newspaperDate = "";
let pages = [];
let currentPage = 0;
/* =========================================================
   縮放
   ========================================================= */
let zoom = 1;
let offsetX = 0;
let offsetY = 0;
/* =========================================================
   Touch 狀態
   ========================================================= */
let dragging = false;
let startX = 0;
let startY = 0;
let startOffsetX = 0;
let startOffsetY = 0;
let touchStartedOnUI = false;
/* =========================================================
   Touch 雙擊狀態
   ========================================================= */
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;
/* =========================================================
   控制欄
   ========================================================= */
let controlsVisible = false;
/* =========================================================
   圖片載入重試狀態
   ========================================================= */
let imageRetryUsed = false;
/* =========================================================
   預載狀態
   ========================================================= */
let preloadGeneration = 0;
let preloadTotal = 0;
let preloadCompleted = 0;
let preloadFailed = 0;
let preloadActive = 0;
const preloadSuccessCache =
    new Set();
/* =========================================================
   Magic Trackpad / Wheel 水平滑動狀態
   ========================================================= */
let trackpadWheelDeltaX = 0;
let trackpadWheelTimer = null;
let trackpadWheelLocked = false;
/*
 * Trackpad 左右滑動翻頁門檻。
 *
 * 原本：120
 * 現在：30
 *
 * 降低門檻後，較輕的 Trackpad 水平滑動
 * 就可以觸發翻頁。
 */
const TRACKPAD_SWIPE_THRESHOLD = 30;
const TRACKPAD_WHEEL_RESET_TIME = 180;
let lastTouchEndTime = 0;
/* =========================================================
   Magic Trackpad 單擊 / 雙擊狀態
   ========================================================= */
let trackpadClickTimer = null;
let lastTrackpadClickTime = 0;
let lastTrackpadClickX = 0;
let lastTrackpadClickY = 0;
const TRACKPAD_DOUBLE_CLICK_TIME = 350;
const TRACKPAD_DOUBLE_CLICK_DISTANCE = 30;
/* =========================================================
   日期工具
   ========================================================= */
function formatDate(date) {
    const year =
        date.getFullYear();
    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");
    const day =
        String(
            date.getDate()
        ).padStart(2, "0");
    return `${year}-${month}-${day}`;
}
function displayDate(dateString) {
    const parts =
        dateString.split("-");
    return `${parts[1]}/${parts[2]}/${parts[0]}`;
}
/* =========================================================
   顯示載入
   ========================================================= */
function showLoading(show) {
    document
        .getElementById("loading")
        .style.display =
            show ? "block" : "none";
}
/* =========================================================
   錯誤訊息
   ========================================================= */
function showError(message) {
    const error =
        document.getElementById(
            "errorMessage"
        );
    error.textContent =
        message;
    error.style.display =
        "block";
}
/* =========================================================
   從 localStorage 讀取某一天的閱讀位置
   ========================================================= */
function getSavedPage(date) {
    const key =
        `worldjournal-page-${date}`;
    const value =
        localStorage.getItem(key);
    if (value === null) {
        return 0;
    }
    const number =
        parseInt(value, 10);
    if (
        Number.isNaN(number) ||
        number < 0
    ) {
        return 0;
    }
    return number;
}
/* =========================================================
   儲存某一天的閱讀位置
   ========================================================= */
function saveCurrentPage() {
    if (!newspaperDate) {
        return;
    }
    localStorage.setItem(
        `worldjournal-page-${newspaperDate}`,
        String(currentPage)
    );
}
/* =========================================================
   建立標準圖片 URL
   ========================================================= */
function buildFallbackImageUrl(
    dateString,
    pageId
) {
    const compactDate =
        dateString.replaceAll("-", "");
    return (
        `https://pgw.worldjournal.com/gw/wj.php` +
        `?u=NY/${compactDate}/NY${compactDate}${pageId}`
    );
}
/* =========================================================
   整理 API 提供的圖片 URL
   ========================================================= */
function normalizeImageUrl(
    imagePath
) {
    if (
        !imagePath ||
        typeof imagePath !== "string"
    ) {
        return "";
    }
    return imagePath.replace(
        /&size=S(?=&|$)/,
        ""
    );
}
/* =========================================================
   更新預載顯示
   ========================================================= */
function updatePreloadStatus(
    generation
) {
    if (
        generation !== preloadGeneration
    ) {
        return;
    }
    const status =
        document.getElementById(
            "preloadStatus"
        );
    if (
        preloadTotal <= 0
    ) {
        status.textContent =
            "預載 0%";
        status.classList.remove(
            "complete"
        );
        status.classList.remove(
            "failed"
        );
        return;
    }
    const finished =
        preloadCompleted +
        preloadFailed;
    const percentage =
        Math.min(
            100,
            Math.round(
                finished /
                preloadTotal *
                100
            )
        );
    if (
        finished >= preloadTotal
    ) {
        if (
            preloadFailed > 0
        ) {
            status.textContent =
                `預載 ${percentage}%（${preloadFailed}失敗）`;
            status.classList.add(
                "failed"
            );
            status.classList.remove(
                "complete"
            );
        } else {
            status.textContent =
                "預載 100%";
            status.classList.add(
                "complete"
            );
            status.classList.remove(
                "failed"
            );
        }
    } else {
        status.textContent =
            `預載 ${percentage}%`;
        status.classList.remove(
            "complete"
        );
        status.classList.remove(
            "failed"
        );
    }
}
/* =========================================================
   預載單張圖片
   ========================================================= */
function preloadSingleImage(
    page,
    generation
) {
    return new Promise(
        function(resolve) {
            const primaryUrl =
                page.imageUrl;
            const fallbackUrl =
                page.fallbackImageUrl;
            let finished = false;
            let retryUsed = false;
            const image =
                new Image();
            image.referrerPolicy =
                "no-referrer";
            function success() {
                if (finished) {
                    return;
                }
                finished = true;
                const key =
                    `${newspaperDate}-${page.pageId}`;
                if (
                    generation ===
                    preloadGeneration
                ) {
                    preloadSuccessCache.add(
                        key
                    );
                    preloadCompleted++;
                    updatePreloadStatus(
                        generation
                    );
                }
                resolve(true);
            }
            function failure() {
                if (finished) {
                    return;
                }
                if (
                    !retryUsed &&
                    fallbackUrl &&
                    fallbackUrl !== primaryUrl
                ) {
                    retryUsed = true;
                    image.src =
                        fallbackUrl;
                    return;
                }
                finished = true;
                if (
                    generation ===
                    preloadGeneration
                ) {
                    preloadFailed++;
                    updatePreloadStatus(
                        generation
                    );
                }
                resolve(false);
            }
            image.onload =
                success;
            image.onerror =
                failure;
            image.src =
                primaryUrl;
        }
    );
}
/* =========================================================
   啟動整批預載
   ========================================================= */
function startPreloading(
    dateString,
    pageList
) {
    preloadGeneration++;
    const generation =
        preloadGeneration;
    preloadTotal =
        pageList.length;
    preloadCompleted = 0;
    preloadFailed = 0;
    preloadActive = 0;
    updatePreloadStatus(
        generation
    );
    if (
        pageList.length === 0
    ) {
        return;
    }
    const queue =
        pageList.slice();
    const current =
        queue.findIndex(
            page =>
                page.pageId ===
                pageList[currentPage]?.pageId
        );
    if (
        current > 0
    ) {
        const first =
            queue.splice(
                current,
                1
            )[0];
        queue.unshift(first);
    }
    const datePrefix =
        `${dateString}-`;
    const pendingQueue = [];
    for (
        const page of queue
    ) {
        const key =
            `${datePrefix}${page.pageId}`;
        if (
            preloadSuccessCache.has(key)
        ) {
            preloadCompleted++;
        } else {
            pendingQueue.push(page);
        }
    }
    updatePreloadStatus(
        generation
    );
    if (
        pendingQueue.length === 0
    ) {
        return;
    }
    let nextIndex = 0;
    async function worker() {
        while (
            nextIndex <
            pendingQueue.length
        ) {
            const index =
                nextIndex++;
            const page =
                pendingQueue[index];
            preloadActive++;
            await preloadSingleImage(
                page,
                generation
            );
            preloadActive--;
        }
    }
    const workerCount =
        Math.min(
            PRELOAD_CONCURRENCY,
            pendingQueue.length
        );
    for (
        let i = 0;
        i < workerCount;
        i++
    ) {
        worker();
    }
}
/* =========================================================
   API 取得某一天
   ========================================================= */
async function loadNewspaper(
    dateString
) {
    showLoading(true);
    document
        .getElementById("errorMessage")
        .style.display =
            "none";
    const url =
        DATA_URL +
        dateString +
        ".json";
    try {
        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );
        if (!response.ok) {
            throw new Error(
                "HTTP " +
                response.status
            );
        }
        const data =
            await response.json();
        if (!Array.isArray(data)) {
            throw new Error(
                "資料格式不正確"
            );
        }
        const filtered =
            data
                .filter(item => {
                    return (
                        typeof item.page_id === "string" &&
                        /^[ABCD]\d{2}$/.test(
                            item.page_id
                        )
                    );
                })
                .sort((a, b) => {
                    return a.page_id.localeCompare(
                        b.page_id
                    );
                });
        if (filtered.length === 0) {
            throw new Error(
                "這一天沒有 A/B/C/D 報紙"
            );
        }
        pages =
            filtered.map(item => {
                const pageId =
                    item.page_id;
                let imageUrl =
                    normalizeImageUrl(
                        item.image_path
                    );
                if (!imageUrl) {
                    imageUrl =
                        buildFallbackImageUrl(
                            dateString,
                            pageId
                        );
                }
                return {
                    pageId:
                        pageId,
                    pageName:
                        item.page_name || "",
                    imageUrl:
                        imageUrl,
                    fallbackImageUrl:
                        buildFallbackImageUrl(
                            dateString,
                            pageId
                        )
                };
            });
        newspaperDate =
            dateString;
        currentPage =
            getSavedPage(
                dateString
            );
        if (
            currentPage >= pages.length
        ) {
            currentPage =
                0;
        }
        buildDatePanel();
        buildPagePanel();
        showPage();
        updateDateButton();
        showLoading(false);
        startPreloading(
            dateString,
            pages
        );
        return true;
    } catch (error) {
        showLoading(false);
        console.log(
            "World Journal API error:",
            error
        );
        return false;
    }
}
/* =========================================================
   自動尋找最新可用報紙
   ========================================================= */
async function findLatestNewspaper() {
    const today =
        new Date();
    for (
        let i = 0;
        i < DAYS_TO_KEEP;
        i++
    ) {
        const date =
            new Date(today);
        date.setDate(
            today.getDate() - i
        );
        const dateString =
            formatDate(date);
        const success =
            await loadNewspaper(
                dateString
            );
        if (success) {
            return true;
        }
    }
    showError(
        "目前無法取得世界日報資料。"
    );
    return false;
}
/* =========================================================
   顯示頁面
   ========================================================= */
function showPage() {
    if (
        pages.length === 0
    ) {
        return;
    }
    const image =
        document.getElementById(
            "pageImage"
        );
    const number =
        document.getElementById(
            "pageNumber"
        );
    const page =
        pages[currentPage];
    imageRetryUsed = false;
    image.src =
        page.imageUrl;
    number.textContent =
        `${page.pageId} / ${pages.length}`;
    resetZoom();
    resetTrackpadWheel();
    updatePagePanelCurrent();
    window.scrollTo(
        0,
        0
    );
    saveCurrentPage();
}
/* =========================================================
   圖片載入失敗時自動使用標準 URL 重試
   ========================================================= */
document
    .getElementById("pageImage")
    .addEventListener(
        "error",
        function() {
            if (
                imageRetryUsed ||
                pages.length === 0
            ) {
                showError(
                    "圖片載入失敗，請稍後再試。"
                );
                return;
            }
            const page =
                pages[currentPage];
            imageRetryUsed = true;
            console.log(
                "World Journal image retry:",
                page.fallbackImageUrl
            );
            this.src =
                page.fallbackImageUrl;
        }
    );
/* =========================================================
   圖片成功載入
   ========================================================= */
document
    .getElementById("pageImage")
    .addEventListener(
        "load",
        function() {
            document
                .getElementById(
                    "errorMessage"
                )
                .style.display =
                "none";
        }
    );
/* =========================================================
   下一頁
   ========================================================= */
function nextPage() {
    if (zoom !== 1) {
        return;
    }
    if (
        currentPage <
        pages.length - 1
    ) {
        saveCurrentPage();
        currentPage++;
        showPage();
    }
}
/* =========================================================
   上一頁
   ========================================================= */
function previousPage() {
    if (zoom !== 1) {
        return;
    }
    if (
        currentPage > 0
    ) {
        saveCurrentPage();
        currentPage--;
        showPage();
    }
}
/* =========================================================
   重設縮放
   ========================================================= */
function resetZoom() {
    zoom = 1;
    offsetX = 0;
    offsetY = 0;
    applyTransform();
}
/* =========================================================
   雙擊縮放
   ========================================================= */
function toggleZoom(
    centerX,
    centerY
) {
    const viewer =
        document.getElementById(
            "viewer"
        );
    const rect =
        viewer.getBoundingClientRect();
    if (zoom === 1) {
        const x =
            centerX -
            rect.left -
            rect.width / 2;
        const y =
            centerY -
            rect.top -
            rect.height / 2;
        offsetX =
            -x * 0.5;
        offsetY =
            -y * 0.5;
        zoom = 1.5;
        applyTransform();
        return;
    }
    resetZoom();
}
/* =========================================================
   套用縮放
   ========================================================= */
function applyTransform() {
    const image =
        document.getElementById(
            "pageImage"
        );
    image.style.transform =
        `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`;
}
/* =========================================================
   控制欄顯示 / 隱藏
   ========================================================= */
function toggleControls() {
    controlsVisible =
        !controlsVisible;
    const controls =
        document.getElementById(
            "controls"
        );
    const datePanel =
        document.getElementById(
            "datePanel"
        );
    const pagePanel =
        document.getElementById(
            "pagePanel"
        );
    if (controlsVisible) {
        controls.classList.add(
            "visible"
        );
    } else {
        controls.classList.remove(
            "visible"
        );
        datePanel.classList.remove(
            "visible"
        );
        pagePanel.classList.remove(
            "visible"
        );
    }
}
/* =========================================================
   日期按鈕
   ========================================================= */
function updateDateButton() {
    document
        .getElementById("dateButton")
        .textContent =
            displayDate(
                newspaperDate
            );
}
/* =========================================================
   建立最近 7 天日期選單
   ========================================================= */
function buildDatePanel() {
    const panel =
        document.getElementById(
            "datePanel"
        );
    panel.innerHTML = "";
    const baseDate =
        new Date();
    for (
        let i = 0;
        i < DAYS_TO_KEEP;
        i++
    ) {
        const date =
            new Date(baseDate);
        date.setDate(
            baseDate.getDate() - i
        );
        const dateString =
            formatDate(date);
        const button =
            document.createElement(
                "button"
            );
        button.className =
            "dateButton";
        if (
            dateString ===
            newspaperDate
        ) {
            button.classList.add(
                "current"
            );
        }
        let label =
            displayDate(
                dateString
            );
        if (i === 0) {
            label +=
                "　今天";
        }
        button.textContent =
            label;
        button.addEventListener(
            "click",
            async function(event) {
                event.stopPropagation();
                panel.classList.remove(
                    "visible"
                );
                document
                    .getElementById(
                        "pagePanel"
                    )
                    .classList.remove(
                        "visible"
                    );
                if (
                    dateString ===
                    newspaperDate
                ) {
                    return;
                }
                saveCurrentPage();
                await loadNewspaper(
                    dateString
                );
            }
        );
        panel.appendChild(
            button
        );
    }
}
/* =========================================================
   建立頁面選單
   ========================================================= */
function buildPagePanel() {
    const panel =
        document.getElementById(
            "pagePanel"
        );
    panel.innerHTML = "";
    for (
        let i = 0;
        i < pages.length;
        i++
    ) {
        const page =
            pages[i];
        const button =
            document.createElement(
                "button"
            );
        button.className =
            "pageButton";
        button.dataset.index =
            String(i);
        if (
            i === currentPage
        ) {
            button.classList.add(
                "current"
            );
        }
        const pageName =
            page.pageName ?
            `　${page.pageName}` :
            "";
        button.textContent =
            `${page.pageId}${pageName}`;
        button.addEventListener(
            "click",
            function(event) {
                event.stopPropagation();
                const targetIndex =
                    Number(
                        button.dataset.index
                    );
                if (
                    Number.isNaN(
                        targetIndex
                    ) ||
                    targetIndex < 0 ||
                    targetIndex >= pages.length
                ) {
                    return;
                }
                saveCurrentPage();
                currentPage =
                    targetIndex;
                panel.classList.remove(
                    "visible"
                );
                showPage();
            }
        );
        panel.appendChild(
            button
        );
    }
}
/* =========================================================
   更新頁面選單目前頁面
   ========================================================= */
function updatePagePanelCurrent() {
    const panel =
        document.getElementById(
            "pagePanel"
        );
    const buttons =
        panel.querySelectorAll(
            ".pageButton"
        );
    buttons.forEach(
        function(button, index) {
            if (
                index === currentPage
            ) {
                button.classList.add(
                    "current"
                );
            } else {
                button.classList.remove(
                    "current"
                );
            }
        }
    );
}

/* =========================================================

/* =========================================================

/* =========================================================

/* =========================================================

/* =========================================================
   Magic Trackpad 水平滑動
   ========================================================= */
function resetTrackpadWheel() {
    trackpadWheelDeltaX = 0;
    trackpadWheelLocked = false;
    if (
        trackpadWheelTimer !== null
    ) {
        clearTimeout(
            trackpadWheelTimer
        );
        trackpadWheelTimer = null;
    }
}
document.addEventListener(
    "wheel",
    function(event) {
        const target =
            event.target;
        if (
            target.closest("#controls") ||
            target.closest("#datePanel") ||
            target.closest("#pagePanel")
        ) {
            return;
        }
        if (zoom !== 1) {
            return;
        }
        if (
            Math.abs(event.deltaX) <
            Math.abs(event.deltaY)
        ) {
            return;
        }
        if (
            Math.abs(event.deltaX) < 1
        ) {
            return;
        }
        trackpadWheelDeltaX +=
            event.deltaX;
        if (
            event.cancelable &&
            Math.abs(event.deltaX) >
            Math.abs(event.deltaY)
        ) {
            event.preventDefault();
        }
        if (
            trackpadWheelTimer !== null
        ) {
            clearTimeout(
                trackpadWheelTimer
            );
        }
        trackpadWheelTimer =
            setTimeout(
                function() {
                    resetTrackpadWheel();
                },
                TRACKPAD_WHEEL_RESET_TIME
            );
        if (
            trackpadWheelLocked
        ) {
            return;
        }
        if (
            Math.abs(trackpadWheelDeltaX) >=
            TRACKPAD_SWIPE_THRESHOLD
        ) {
            if (
                trackpadWheelDeltaX > 0
            ) {
                nextPage();
            } else {
                previousPage();
            }
            trackpadWheelLocked = true;
        }
    },
    {
        passive: false
    }
);
/* =========================================================
   Trackpad / 滑鼠單擊、雙擊
   ========================================================= */
document.addEventListener(
    "click",
    function(event) {
        const target =
            event.target;
        if (
            target.closest("#controls") ||
            target.closest("#datePanel") ||
            target.closest("#pagePanel")
        ) {
            return;
        }
        if (
            Date.now() -
            lastTouchEndTime <
            500
        ) {
            return;
        }
        const now =
            Date.now();
        const clickX =
            event.clientX;
        const clickY =
            event.clientY;
        const timeSinceLastClick =
            now -
            lastTrackpadClickTime;
        const distanceSinceLastClick =
            Math.sqrt(
                Math.pow(
                    clickX -
                    lastTrackpadClickX,
                    2
                ) +
                Math.pow(
                    clickY -
                    lastTrackpadClickY,
                    2
                )
            );
        if (
            timeSinceLastClick <
            TRACKPAD_DOUBLE_CLICK_TIME &&
            distanceSinceLastClick <
            TRACKPAD_DOUBLE_CLICK_DISTANCE
        ) {
            if (
                trackpadClickTimer !== null
            ) {
                clearTimeout(
                    trackpadClickTimer
                );
                trackpadClickTimer =
                    null;
            }
            lastTrackpadClickTime = 0;
            lastTrackpadClickX = 0;
            lastTrackpadClickY = 0;
            toggleZoom(
                clickX,
                clickY
            );
            return;
        }
        if (
            trackpadClickTimer !== null
        ) {
            clearTimeout(
                trackpadClickTimer
            );
            trackpadClickTimer =
                null;
        }
        lastTrackpadClickTime =
            now;
        lastTrackpadClickX =
            clickX;
        lastTrackpadClickY =
            clickY;
        trackpadClickTimer =
            setTimeout(
                function() {
                    trackpadClickTimer =
                        null;
                    lastTrackpadClickTime =
                        0;
                    lastTrackpadClickX =
                        0;
                    lastTrackpadClickY =
                        0;
                    toggleControls();
                },
                TRACKPAD_DOUBLE_CLICK_TIME
            );
    }
);
/* =========================================================
   Touch Start
   ========================================================= */
document.addEventListener(
    "touchstart",
    function(event) {
        const target =
            event.target;
        touchStartedOnUI =
            target.closest("#controls") !== null ||
            target.closest("#datePanel") !== null ||
            target.closest("#pagePanel") !== null;
        const touch =
            event.touches[0];
        startX =
            touch.clientX;
        startY =
            touch.clientY;
        startOffsetX =
            offsetX;
        startOffsetY =
            offsetY;
        dragging = false;
    },
    {
        passive: true
    }
);
/* =========================================================
   Touch Move
   ========================================================= */
document.addEventListener(
    "touchmove",
    function(event) {
        const touch =
            event.touches[0];
        const deltaX =
            touch.clientX -
            startX;
        const deltaY =
            touch.clientY -
            startY;
        if (
            Math.abs(deltaX) > 5 ||
            Math.abs(deltaY) > 5
        ) {
            dragging = true;
        }
        if (touchStartedOnUI) {
            return;
        }
        if (zoom === 1) {
            return;
        }
        offsetX =
            startOffsetX +
            deltaX;
        offsetY =
            startOffsetY +
            deltaY;
        applyTransform();
    },
    {
        passive: true
    }
);
/* =========================================================
   Touch End
   ========================================================= */
document.addEventListener(
    "touchend",
    function(event) {
        lastTouchEndTime =
            Date.now();
        if (touchStartedOnUI) {
            lastTapTime = 0;
            return;
        }
        const touch =
            event.changedTouches[0];
        const now =
            Date.now();
        const deltaX =
            touch.clientX -
            startX;
        const deltaY =
            touch.clientY -
            startY;
        const moved =
            Math.abs(deltaX) > 5 ||
            Math.abs(deltaY) > 5;
        if (moved) {
            lastTapTime = 0;
            if (zoom !== 1) {
                return;
            }
            const minimumSwipe = 80;
            if (
                Math.abs(deltaX) <
                minimumSwipe
            ) {
                return;
            }
            if (
                Math.abs(deltaX) <=
                Math.abs(deltaY)
            ) {
                return;
            }
            if (deltaX < 0) {
                nextPage();
            } else {
                previousPage();
            }
            return;
        }
        const timeSinceLastTap =
            now -
            lastTapTime;
        const distanceSinceLastTap =
            Math.sqrt(
                Math.pow(
                    touch.clientX -
                    lastTapX,
                    2
                ) +
                Math.pow(
                    touch.clientY -
                    lastTapY,
                    2
                )
            );
        if (
            timeSinceLastTap < 350 &&
            distanceSinceLastTap < 30
        ) {
            toggleZoom(
                touch.clientX,
                touch.clientY
            );
            lastTapTime = 0;
            return;
        }
        lastTapTime =
            now;
        lastTapX =
            touch.clientX;
        lastTapY =
            touch.clientY;
        setTimeout(
            function() {
                if (
                    lastTapTime ===
                    now
                ) {
                    toggleControls();
                }
            },
            350
        );
    }
);
/* =========================================================
   啟動
   ========================================================= */
findLatestNewspaper();
</script>
