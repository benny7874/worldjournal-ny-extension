<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="世界日報－紐約">
<meta name="mobile-web-app-capable" content="yes">
<title>世界日報－紐約</title>
<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
}
body {
    display: flex;
    flex-direction: column;
    align-items: center;
}
#viewer {
    position: relative;
    width: 100%;
    overflow: visible;
    touch-action: pan-y;
    overscroll-behavior-x: none;
}
#pageImage {
    display: block;
    width: auto;
    max-width: 100%;
    height: auto;
    min-height: 1px;
    margin: 0 auto;
    transform-origin: center center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
}
#loading,
#errorMessage {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    text-align: center;
    z-index: 90;
}
#loading {
    display: none;
    background: rgba(30, 30, 30, 0.9);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 16px;
    z-index: 100;
}
#errorMessage {
    display: none;
    width: 80%;
    max-width: 400px;
    background: rgba(40, 40, 40, 0.95);
    padding: 20px;
    border-radius: 12px;
}
#controls {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 50;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 14px;
    background: rgba(25, 25, 25, 0.92);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    white-space: nowrap;
}
#controls.visible {
    display: flex;
}
.controlButton {
    background: #333;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 9px 13px;
    font-size: 16px;
    white-space: nowrap;
}
.controlButton:active {
    background: #555;
}
#pageNumber {
    min-width: 70px;
    text-align: center;
    font-size: 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
}
#preloadStatus {
    min-width: 78px;
    text-align: center;
    font-size: 14px;
    color: #ddd;
    white-space: nowrap;
}
#preloadStatus.complete,
#preloadStatus.failed {
    color: #fff;
}
#datePanel,
#pagePanel {
    position: fixed;
    left: 50%;
    bottom: calc(75px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 60;
    display: none;
    max-height: 70vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: rgba(25, 25, 25, 0.96);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
}
#datePanel {
    width: min(90vw, 330px);
    max-height: min(70vh, 520px);
}
#pagePanel {
    width: min(90vw, 360px);
    max-height: min(70vh, 560px);
}
#datePanel.visible,
#pagePanel.visible {
    display: block;
}
.dateButton,
.pageButton {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: #333;
    color: #fff;
    border: 0;
    border-radius: 8px;
    text-align: left;
}
.dateButton {
    padding: 11px;
    margin: 5px 0;
    font-size: 16px;
}
.pageButton {
    padding: 10px 12px;
    margin: 4px 0;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.dateButton.current,
.pageButton.current {
    background: #555;
}
.dateButton:active,
.pageButton:active {
    background: #666;
}
</style>
</head>
<body>
<div id="viewer">
    <img
        id="pageImage"
        alt="世界日報"
        draggable="false"
        referrerpolicy="no-referrer">
</div>
<div id="loading">載入報紙…</div>
<div id="errorMessage"></div>
<div id="datePanel"></div>
<div id="pagePanel"></div>
<div id="controls">
    <span id="preloadStatus">預載 0%</span>
    <button class="controlButton" id="dateButton">
        09/21/2026
    </button>
    <button class="controlButton" id="previousButton">
        ‹
    </button>
    <span id="pageNumber" role="button" tabindex="0">
        A01 / 40
    </span>
    <button class="controlButton" id="nextButton">
        ›
    </button>
</div>
<script>
/* =========================
   基本設定
   ========================= */
const DAYS_TO_KEEP = 7;
const DATA_URL =
    "https://www.worldjournal.com/datafeed/wj/ny/NY-";
const SECTION_ORDER = ["A", "B", "C", "D"];
const PRELOAD_CONCURRENCY = 4;
/* Trackpad 翻頁敏感度 */
const TRACKPAD_SWIPE_THRESHOLD = 10;
const TRACKPAD_DOUBLE_CLICK_TIME = 500;
const TRACKPAD_DOUBLE_CLICK_DISTANCE = 30;
const TOUCH_DOUBLE_TAP_TIME = 350;
const TOUCH_DOUBLE_TAP_DISTANCE = 30;
const TOUCH_SWIPE_THRESHOLD = 80;
/* =========================
   DOM
   ========================= */
const viewer =
    document.getElementById("viewer");
const pageImage =
    document.getElementById("pageImage");
const loading =
    document.getElementById("loading");
const errorMessage =
    document.getElementById("errorMessage");
const controls =
    document.getElementById("controls");
const dateButton =
    document.getElementById("dateButton");
const previousButton =
    document.getElementById("previousButton");
const pageNumber =
    document.getElementById("pageNumber");
const nextButton =
    document.getElementById("nextButton");
const preloadStatus =
    document.getElementById("preloadStatus");
const datePanel =
    document.getElementById("datePanel");
const pagePanel =
    document.getElementById("pagePanel");
/* =========================
   閱讀資料
   ========================= */
let newspaperDate = "";
let pages = [];
let currentPage = 0;
/* =========================
   縮放
   ========================= */
let zoom = 1;
let offsetX = 0;
let offsetY = 0;
/* =========================
   Touch
   ========================= */
let dragging = false;
let startX = 0;
let startY = 0;
let startOffsetX = 0;
let startOffsetY = 0;
let touchStartedOnUI = false;
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;
let lastTouchEndTime = 0;
/* =========================
   多指／Pinch
   ========================= */
let multiTouchGesture = false;
let pinchStartDistance = 0;
let pinchStartZoom = 1;
let pinchStartCenterX = 0;
let pinchStartCenterY = 0;
let pinchStartOffsetX = 0;
let pinchStartOffsetY = 0;
let pinchImageCenterX = 0;
let pinchImageCenterY = 0;
/* =========================
   控制欄
   ========================= */
let controlsVisible = false;
/* =========================
   圖片載入
   ========================= */
let imageRetryUsed = false;
/* =========================
   預載
   ========================= */
let preloadGeneration = 0;
let preloadTotal = 0;
let preloadCompleted = 0;
let preloadFailed = 0;
const preloadSuccessCache =
    new Set();
/* =========================
   Trackpad
   ========================= */
let trackpadWheelDeltaX = 0;
let trackpadWheelLocked = false;
let lastTrackpadPinchTime = 0;
let trackpadPinchZooming = false;
let trackpadPinchDirection = 0;
let trackpadPointerTimer = null;
let lastTrackpadPointerTime = 0;
let lastTrackpadPointerX = 0;
let lastTrackpadPointerY = 0;
/* =========================
   日期
   ========================= */
function formatDate(date) {
    const year =
        date.getFullYear();
    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");
    const day =
        String(
            date.getDate()
        ).padStart(2, "0");
    return `${year}-${month}-${day}`;
}
function displayDate(dateString) {
    const [, month, day] =
        dateString.split("-");
    return `${Number(month)}/${Number(day)}`;
}
/* =========================
   UI
   ========================= */
function showLoading(show) {
    loading.style.display =
        show ? "block" : "none";
}
function showError(message) {
    errorMessage.textContent =
        message;
    errorMessage.style.display =
        "block";
}
function hideError() {
    errorMessage.style.display =
        "none";
}
/* =========================
   localStorage
   ========================= */
function getSavedPage(date) {
    const value =
        localStorage.getItem(
            `worldjournal-page-${date}`
        );
    if (value === null) {
        return 0;
    }
    const number =
        parseInt(value, 10);
    return Number.isNaN(number) ||
        number < 0
        ? 0
        : number;
}
function saveCurrentPage() {
    if (!newspaperDate) {
        return;
    }
    localStorage.setItem(
        `worldjournal-page-${newspaperDate}`,
        String(currentPage)
    );
}
/* =========================
   圖片 URL
   ========================= */
function buildFallbackImageUrl(
    dateString,
    pageId
) {
    const compactDate =
        dateString.replaceAll("-", "");
    return (
        `https://pgw.worldjournal.com/gw/wj.php` +
        `?u=NY/${compactDate}/NY${compactDate}${pageId}`
    );
}
function normalizeImageUrl(imagePath) {
    if (
        !imagePath ||
        typeof imagePath !== "string"
    ) {
        return "";
    }
    return imagePath.replace(
        /&size=S(?=&|$)/,
        ""
    );
}
/* =========================
   預載顯示
   ========================= */
function updatePreloadStatus(
    generation
) {
    if (
        generation !==
        preloadGeneration
    ) {
        return;
    }
    if (preloadTotal <= 0) {
        preloadStatus.textContent =
            "預載 0%";
        preloadStatus.classList.remove(
            "complete",
            "failed"
        );
        return;
    }
    const finished =
        preloadCompleted +
        preloadFailed;
    const percentage =
        Math.min(
            100,
            Math.round(
                finished /
                preloadTotal *
                100
            )
        );
    if (
        finished >=
        preloadTotal
    ) {
        if (
            preloadFailed > 0
        ) {
            preloadStatus.textContent =
                `預載 ${percentage}%（${preloadFailed}失敗）`;
            preloadStatus.classList.add(
                "failed"
            );
            preloadStatus.classList.remove(
                "complete"
            );
        } else {
            preloadStatus.textContent =
                "預載 100%";
            preloadStatus.classList.add(
                "complete"
            );
            preloadStatus.classList.remove(
                "failed"
            );
        }
        return;
    }
    preloadStatus.textContent =
        `預載 ${percentage}%`;
    preloadStatus.classList.remove(
        "complete",
        "failed"
    );
}
/* =========================
   預載單張圖片
   ========================= */
function preloadSingleImage(
    page,
    generation,
    dateString
) {
    return new Promise(
        resolve => {
            const primaryUrl =
                page.imageUrl;
            const fallbackUrl =
                page.fallbackImageUrl;
            let finished = false;
            let retryUsed = false;
            const image =
                new Image();
            image.referrerPolicy =
                "no-referrer";
            function success() {
                if (finished) {
                    return;
                }
                finished = true;
                if (
                    generation ===
                    preloadGeneration
                ) {
                    preloadSuccessCache.add(
                        `${dateString}-${page.pageId}`
                    );
                    preloadCompleted++;
                    updatePreloadStatus(
                        generation
                    );
                }
                resolve(true);
            }
            function failure() {
                if (finished) {
                    return;
                }
                if (
                    !retryUsed &&
                    fallbackUrl &&
                    fallbackUrl !==
                    primaryUrl
                ) {
                    retryUsed = true;
                    image.src =
                        fallbackUrl;
                    return;
                }
                finished = true;
                if (
                    generation ===
                    preloadGeneration
                ) {
                    preloadFailed++;
                    updatePreloadStatus(
                        generation
                    );
                }
                resolve(false);
            }
            image.onload =
                success;
            image.onerror =
                failure;
            image.src =
                primaryUrl;
        }
    );
}
/* =========================
   整批預載
   ========================= */
function startPreloading(
    dateString,
    pageList
) {
    preloadGeneration++;
    const generation =
        preloadGeneration;
    preloadTotal =
        pageList.length;
    preloadCompleted =
        0;
    preloadFailed =
        0;
    updatePreloadStatus(
        generation
    );
    if (!pageList.length) {
        return;
    }
    const queue =
        pageList.slice();
    const currentIndex =
        queue.findIndex(
            page =>
                page.pageId ===
                pageList[
                    currentPage
                ]?.pageId
        );
    if (currentIndex > 0) {
        const [first] =
            queue.splice(
                currentIndex,
                1
            );
        queue.unshift(first);
    }
    const pendingQueue = [];
    for (
        const page of queue
    ) {
        const key =
            `${dateString}-${page.pageId}`;
        if (
            preloadSuccessCache.has(
                key
            )
        ) {
            preloadCompleted++;
        } else {
            pendingQueue.push(
                page
            );
        }
    }
    updatePreloadStatus(
        generation
    );
    if (
        !pendingQueue.length
    ) {
        return;
    }
    let nextIndex = 0;
    async function worker() {
        while (
            nextIndex <
            pendingQueue.length
        ) {
            const page =
                pendingQueue[
                    nextIndex++
                ];
            await preloadSingleImage(
                page,
                generation,
                dateString
            );
        }
    }
    const workerCount =
        Math.min(
            PRELOAD_CONCURRENCY,
            pendingQueue.length
        );
    for (
        let i = 0;
        i < workerCount;
        i++
    ) {
        worker();
    }
}
/* =========================
   取得報紙
   ========================= */
async function loadNewspaper(
    dateString
) {
    showLoading(true);
    hideError();
    try {
        const response =
            await fetch(
                DATA_URL +
                dateString +
                ".json",
                {
                    cache:
                        "no-store"
                }
            );
        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }
        const data =
            await response.json();
        if (
            !Array.isArray(data)
        ) {
            throw new Error(
                "資料格式不正確"
            );
        }
        const filtered =
            data
                .filter(
                    item =>
                        typeof item.page_id ===
                        "string" &&
                        /^[ABCD]\d{2}$/.test(
                            item.page_id
                        )
                )
                .sort(
                    (a, b) =>
                        a.page_id.localeCompare(
                            b.page_id
                        )
                );
        if (
            !filtered.length
        ) {
            throw new Error(
                "這一天沒有 A/B/C 報紙"
            );
        }
        pages =
            filtered.map(
                item => {
                    const pageId =
                        item.page_id;
                    let imageUrl =
                        normalizeImageUrl(
                            item.image_path
                        );
                    const fallbackImageUrl =
                        buildFallbackImageUrl(
                            dateString,
                            pageId
                        );
                    if (!imageUrl) {
                        imageUrl =
                            fallbackImageUrl;
                    }
                    return {
                        pageId,
                        pageName:
                            item.page_name ||
                            "",
                        imageUrl,
                        fallbackImageUrl
                    };
                }
            );
        newspaperDate =
            dateString;
        currentPage =
            Math.min(
                getSavedPage(
                    dateString
                ),
                pages.length - 1
            );
        buildDatePanel();
        buildPagePanel();
        showPage();
        updateDateButton();
        showLoading(false);
        startPreloading(
            dateString,
            pages
        );
        return true;
    } catch (error) {
        showLoading(false);
        console.log(
            "World Journal API error:",
            error
        );
        return false;
    }
}
/* =========================
   找最新報紙
   ========================= */
async function findLatestNewspaper() {
    const today =
        new Date();
    for (
        let i = 0;
        i < DAYS_TO_KEEP;
        i++
    ) {
        const date =
            new Date(today);
        date.setDate(
            today.getDate() - i
        );
        if (
            await loadNewspaper(
                formatDate(date)
            )
        ) {
            return true;
        }
    }
    showError(
        "目前無法取得世界日報資料。"
    );
    return false;
}
/* =========================
   顯示目前頁面
   ========================= */
function showPage() {
    if (!pages.length) {
        return;
    }
    const page =
        pages[currentPage];
    imageRetryUsed =
        false;
    pageImage.src =
        page.imageUrl;
    pageNumber.textContent =
        `${page.pageId} / ${pages.length}`;
    resetZoom();
    resetTrackpadWheel();
    updatePagePanelCurrent();
    window.scrollTo(
        0,
        0
    );
    saveCurrentPage();
}
/* =========================
   圖片錯誤／成功
   ========================= */
pageImage.addEventListener(
    "error",
    function() {
        if (
            imageRetryUsed ||
            !pages.length
        ) {
            showError(
                "圖片載入失敗，請稍後再試。"
            );
            return;
        }
        const page =
            pages[currentPage];
        imageRetryUsed =
            true;
        console.log(
            "World Journal image retry:",
            page.fallbackImageUrl
        );
        this.src =
            page.fallbackImageUrl;
    }
);
pageImage.addEventListener(
    "load",
    hideError
);
/* =========================
   翻頁
   ========================= */
function nextPage() {
    if (
        zoom !== 1 ||
        currentPage >=
        pages.length - 1
    ) {
        return;
    }
    saveCurrentPage();
    currentPage++;
    showPage();
}
function previousPage() {
    if (
        zoom !== 1 ||
        currentPage <= 0
    ) {
        return;
    }
    saveCurrentPage();
    currentPage--;
    showPage();
}
/* =========================
   放大邊界
   ========================= */
function getZoomBounds() {
    const baseWidth =
        pageImage.offsetWidth;
    const baseHeight =
        pageImage.offsetHeight;
    if (
        !baseWidth ||
        !baseHeight ||
        zoom <= 1
    ) {
        return {
            maxX: 0,
            maxY: 0
        };
    }
    return {
        maxX:
            baseWidth *
            (zoom - 1) /
            2,
        maxY:
            baseHeight *
            (zoom - 1) /
            2
    };
}
function clampOffsets() {
    if (zoom <= 1) {
        offsetX = 0;
        offsetY = 0;
        return;
    }
    const bounds =
        getZoomBounds();
    offsetX =
        Math.max(
            -bounds.maxX,
            Math.min(
                bounds.maxX,
                offsetX
            )
        );
    offsetY =
        Math.max(
            -bounds.maxY,
            Math.min(
                bounds.maxY,
                offsetY
            )
        );
}
/* =========================
   縮放
   ========================= */
function resetZoom() {
    zoom = 1;
    offsetX = 0;
    offsetY = 0;
    applyTransform();
}
function toggleZoom(
    centerX,
    centerY
) {
    /*
       Zoom 只有兩個狀態：
       1× ↔ 1.5×
    */
    if (
        zoom > 1.001
    ) {
        resetZoom();
        return;
    }
    zoom = 1.5;
    const rect =
        viewer.getBoundingClientRect();
    const x =
        centerX -
        rect.left -
        rect.width / 2;
    const y =
        centerY -
        rect.top -
        rect.height / 2;
    offsetX =
        -x * 0.5;
    offsetY =
        -y * 0.5;
    clampOffsets();
    applyTransform();
}
function applyTransform() {
    clampOffsets();
    pageImage.style.transform =
        `translate3d(${offsetX}px, ${offsetY}px, 0) scale(${zoom})`;
}
/* =========================
   控制欄
   ========================= */
function toggleControls() {
    controlsVisible =
        !controlsVisible;
    controls.classList.toggle(
        "visible",
        controlsVisible
    );
    if (!controlsVisible) {
        datePanel.classList.remove(
            "visible"
        );
        pagePanel.classList.remove(
            "visible"
        );
    }
}
/* =========================
   日期按鈕
   ========================= */
function updateDateButton() {
    const [
        year,
        month,
        day
    ] =
        newspaperDate.split("-");
    dateButton.textContent =
        `${month}/${day}/${year}`;
}
/* =========================
   日期面板
   ========================= */
function closePanels() {
    datePanel.classList.remove(
        "visible"
    );
    pagePanel.classList.remove(
        "visible"
    );
}
function buildDatePanel() {
    datePanel.innerHTML =
        "";
    const baseDate =
        new Date();
    for (
        let i = 0;
        i < DAYS_TO_KEEP;
        i++
    ) {
        const date =
            new Date(baseDate);
        date.setDate(
            baseDate.getDate() -
            i
        );
        const dateString =
            formatDate(date);
        const button =
            document.createElement(
                "button"
            );
        button.className =
            "dateButton";
        button.classList.toggle(
            "current",
            dateString ===
            newspaperDate
        );
        let label =
            displayDate(
                dateString
            );
        if (i === 0) {
            label +=
                "　今天";
        }
        button.textContent =
            label;
        button.addEventListener(
            "click",
            async event => {
                event.stopPropagation();
                closePanels();
                if (
                    dateString ===
                    newspaperDate
                ) {
                    return;
                }
                saveCurrentPage();
                await loadNewspaper(
                    dateString
                );
            }
        );
        datePanel.appendChild(
            button
        );
    }
}
function buildPagePanel() {
    pagePanel.innerHTML =
        "";
    pages.forEach(
        (page, index) => {
            const button =
                document.createElement(
                    "button"
                );
            button.className =
                "pageButton";
            button.dataset.index =
                String(index);
            button.classList.toggle(
                "current",
                index ===
                currentPage
            );
            const pageName =
                page.pageName
                    ? `　${page.pageName}`
                    : "";
            button.textContent =
                `${page.pageId}${pageName}`;
            button.addEventListener(
                "click",
                event => {
                    event.stopPropagation();
                    const targetIndex =
                        Number(
                            button.dataset.index
                        );
                    if (
                        Number.isNaN(
                            targetIndex
                        ) ||
                        targetIndex < 0 ||
                        targetIndex >=
                        pages.length
                    ) {
                        return;
                    }
                    saveCurrentPage();
                    currentPage =
                        targetIndex;
                    pagePanel.classList.remove(
                        "visible"
                    );
                    showPage();
                }
            );
            pagePanel.appendChild(
                button
            );
        }
    );
}
function updatePagePanelCurrent() {
    pagePanel
        .querySelectorAll(
            ".pageButton"
        )
        .forEach(
            (
                button,
                index
            ) => {
                button.classList.toggle(
                    "current",
                    index ===
                    currentPage
                );
            }
        );
}
/* =========================

pageNumber.addEventListener(

/* =========================
   Trackpad 水平滑動
   ========================= */
function resetTrackpadWheel() {
    trackpadWheelDeltaX = 0;
    trackpadWheelLocked = false;
    trackpadPinchZooming = false;
    trackpadPinchDirection = 0;
    lastTrackpadPointerTime = 0;
    if (
        trackpadPointerTimer !== null
    ) {
        clearTimeout(
            trackpadPointerTimer
        );
        trackpadPointerTimer = null;
    }
}
/*
   Trackpad wheel：
   1× + 水平滑動 → 翻頁
   Pinch → 連續縮放
   Zoom > 1 → 水平滑動只移動畫面
*/
document.addEventListener(
    "wheel",
    event => {
        const target =
            event.target;
        if (
            target.closest("#controls") ||
            target.closest("#datePanel") ||
            target.closest("#pagePanel")
        ) {
            return;
        }
        const absX =
            Math.abs(
                event.deltaX
            );
        const absY =
            Math.abs(
                event.deltaY
            );
        if (
            absX < 1 &&
            absY < 1
        ) {
            return;
        }
        /* =========================
           Trackpad Pinch
           ========================= */
        if (
            event.ctrlKey ||
            event.metaKey
        ) {
            if (
                event.cancelable
            ) {
                event.preventDefault();
            }
            lastTrackpadPinchTime =
                performance.now();
            trackpadPinchZooming =
                true;

            const oldZoom =
                zoom;
            const delta =
                Math.max(
                    -100,
                    Math.min(
                        100,
                        event.deltaY
                    )
                );
            const scale =
                Math.exp(
                    -delta * 0.005
                );
            const newZoom =
                Math.max(
                    1,
                    oldZoom * scale
                );

            const imageRect =
                pageImage.getBoundingClientRect();
            const imageCenterX =
                imageRect.left +
                imageRect.width / 2 -
                offsetX;
            const imageCenterY =
                imageRect.top +
                imageRect.height / 2 -
                offsetY;

            const localX =
                (
                    event.clientX -
                    imageCenterX -
                    offsetX
                ) /
                oldZoom;
            const localY =
                (
                    event.clientY -
                    imageCenterY -
                    offsetY
                ) /
                oldZoom;

            zoom =
                newZoom;
            offsetX =
                event.clientX -
                imageCenterX -
                localX *
                newZoom;
            offsetY =
                event.clientY -
                imageCenterY -
                localY *
                newZoom;

            clampOffsets();
            applyTransform();
            return;
        }
        /* =========================
           放大狀態：
           只移動圖片
           ========================= */
        if (
            zoom > 1.001
        ) {
            if (
                event.cancelable
            ) {
                event.preventDefault();
            }
            offsetX +=
                event.deltaX;
            offsetY +=
                event.deltaY;
            clampOffsets();
            applyTransform();
            return;
        }
        /*
           Pinch 結束後，
           忽略極短的最後 wheel，
           避免把 Pinch 尾端誤認為
           水平翻頁。
        */
        if (
            trackpadPinchZooming &&
            performance.now() -
            lastTrackpadPinchTime <
            100
        ) {
            if (
                event.cancelable
            ) {
                event.preventDefault();
            }
            return;
        }
        trackpadPinchZooming =
            false;
        trackpadPinchDirection =
            0;
        /* =========================
           1×：
           水平滑動翻頁
           ========================= */
        if (
            absX < 1 ||
            absX < absY
        ) {
            return;
        }
        trackpadWheelDeltaX +=
            event.deltaX;
        if (
            event.cancelable
        ) {
            event.preventDefault();
        }
        if (
            trackpadWheelLocked
        ) {
            return;
        }
        if (
            Math.abs(
                trackpadWheelDeltaX
            ) >=
            TRACKPAD_SWIPE_THRESHOLD
        ) {
            if (
                trackpadWheelDeltaX > 0
            ) {
                nextPage();
            } else {
                previousPage();
            }
            trackpadWheelLocked =
                true;
        }
    },
    {
        passive: false
    }
);
/* =========================
   Trackpad／滑鼠雙擊
   =========================
   不再使用 click / dblclick。
   iPad Trackpad 會產生 pointer 事件，
   pointerType 通常為 mouse。
   第一次 pointerup：
   等待第二次。
   第二次 pointerup：
   在時間及距離範圍內，
   視為雙擊並切換 Zoom。
   如果沒有第二次：
   保留原本單擊顯示／隱藏控制欄。
*/
document.addEventListener(
    "pointerup",
    event => {
        const target =
            event.target;
        if (
            target.closest("#controls") ||
            target.closest("#datePanel") ||
            target.closest("#pagePanel")
        ) {
            return;
        }
        /*
           只處理 Trackpad／滑鼠。
           Touch 交給下面原本的 touchend。
        */
        if (
            event.pointerType !== "mouse"
        ) {
            return;
        }
        if (
            Date.now() -
            lastTouchEndTime <
            500
        ) {
            return;
        }
        const now =
            performance.now();
        const distance =
            Math.hypot(
                event.clientX -
                lastTrackpadPointerX,
                event.clientY -
                lastTrackpadPointerY
            );
        /*
           第二次 pointerup：
           視為 Trackpad 雙擊。
        */
        if (
            lastTrackpadPointerTime > 0 &&
            now -
            lastTrackpadPointerTime <=
            TRACKPAD_DOUBLE_CLICK_TIME &&
            distance <=
            TRACKPAD_DOUBLE_CLICK_DISTANCE
        ) {
            lastTrackpadPointerTime =
                0;
            if (
                trackpadPointerTimer !== null
            ) {
                clearTimeout(
                    trackpadPointerTimer
                );
                trackpadPointerTimer =
                    null;
            }
            toggleZoom(
                event.clientX,
                event.clientY
            );
            return;
        }
        /*
           第一次 pointerup。
        */
        lastTrackpadPointerTime =
            now;
        lastTrackpadPointerX =
            event.clientX;
        lastTrackpadPointerY =
            event.clientY;
        if (
            trackpadPointerTimer !== null
        ) {
            clearTimeout(
                trackpadPointerTimer
            );
        }
        trackpadPointerTimer =
            setTimeout(
                () => {
                    trackpadPointerTimer =
                        null;
                    if (
                        lastTrackpadPointerTime ===
                        now
                    ) {
                        lastTrackpadPointerTime =
                            0;
                        toggleControls();
                    }
                },
                TRACKPAD_DOUBLE_CLICK_TIME
            );
    }
);
/* =========================
   Touch Start
   ========================= */
document.addEventListener(
    "touchstart",
    event => {
        const target =
            event.target;
        touchStartedOnUI =
            target.closest(
                "#controls"
            ) !== null ||
            target.closest(
                "#datePanel"
            ) !== null ||
            target.closest(
                "#pagePanel"
            ) !== null;
        if (
            touchStartedOnUI
        ) {
            return;
        }
        /* =========================
           雙指開始
           ========================= */
        if (
            event.touches.length >= 2
        ) {
            multiTouchGesture =
                true;
            lastTapTime =
                0;
            const touch1 =
                event.touches[0];
            const touch2 =
                event.touches[1];
            const dx =
                touch2.clientX -
                touch1.clientX;
            const dy =
                touch2.clientY -
                touch1.clientY;
            pinchStartDistance =
                Math.hypot(
                    dx,
                    dy
                );
            pinchStartZoom =
                zoom;
            pinchStartCenterX =
                (
                    touch1.clientX +
                    touch2.clientX
                ) / 2;
            pinchStartCenterY =
                (
                    touch1.clientY +
                    touch2.clientY
                ) / 2;
            pinchStartOffsetX =
                offsetX;
            pinchStartOffsetY =
                offsetY;

            const imageRect =
                pageImage.getBoundingClientRect();
            pinchImageCenterX =
                imageRect.left +
                imageRect.width / 2 -
                offsetX;
            pinchImageCenterY =
                imageRect.top +
                imageRect.height / 2 -
                offsetY;

            dragging =
                false;
            return;
        }
        /* =========================
           單指開始
           ========================= */
        const touch =
            event.touches[0];
        startX =
            touch.clientX;
        startY =
            touch.clientY;
        startOffsetX =
            offsetX;
        startOffsetY =
            offsetY;
        dragging =
            false;
    },
    {
        passive: true
    }
);
/* =========================
   Touch Move
   ========================= */
document.addEventListener(
    "touchmove",
    event => {
        if (
            touchStartedOnUI
        ) {
            return;
        }
        /* =========================
           雙指 Pinch
           ========================= */
        if (
            event.touches.length >= 2
        ) {
            multiTouchGesture =
                true;
            if (
                event.cancelable
            ) {
                event.preventDefault();
            }
            const touch1 =
                event.touches[0];
            const touch2 =
                event.touches[1];
            const dx =
                touch2.clientX -
                touch1.clientX;
            const dy =
                touch2.clientY -
                touch1.clientY;
            const currentDistance =
                Math.hypot(
                    dx,
                    dy
                );
            let newZoom =
                pinchStartZoom;
            if (
                pinchStartDistance > 0
            ) {
                const scale =
                    currentDistance /
                    pinchStartDistance;
                newZoom =
                    pinchStartZoom *
                    scale;
                newZoom =
                    Math.max(
                        1,
                        newZoom
                    );
            }
            const currentCenterX =
                (
                    touch1.clientX +
                    touch2.clientX
                ) / 2;
            const currentCenterY =
                (
                    touch1.clientY +
                    touch2.clientY
                ) / 2;

            const localX =
                (
                    pinchStartCenterX -
                    pinchImageCenterX -
                    pinchStartOffsetX
                ) /
                pinchStartZoom;
            const localY =
                (
                    pinchStartCenterY -
                    pinchImageCenterY -
                    pinchStartOffsetY
                ) /
                pinchStartZoom;

            zoom =
                newZoom;
            offsetX =
                currentCenterX -
                pinchImageCenterX -
                localX *
                newZoom;
            offsetY =
                currentCenterY -
                pinchImageCenterY -
                localY *
                newZoom;

            clampOffsets();
            applyTransform();
            return;
        }
        /* =========================
           單指移動
           ========================= */
        const touch =
            event.touches[0];
        const deltaX =
            touch.clientX -
            startX;
        const deltaY =
            touch.clientY -
            startY;
        if (
            Math.abs(deltaX) > 5 ||
            Math.abs(deltaY) > 5
        ) {
            dragging =
                true;
        }
        /* =========================
           放大後：
           單指自由移動
           ========================= */
        if (
            zoom !== 1
        ) {
            if (
                event.cancelable
            ) {
                event.preventDefault();
            }
            offsetX =
                startOffsetX +
                deltaX;
            offsetY =
                startOffsetY +
                deltaY;
            clampOffsets();
            applyTransform();
            return;
        }
        /* =========================
           1×：
           保留原本垂直頁面滾動
           ========================= */
        return;
    },
    {
        passive: false
    }
);
/* =========================
   Touch End
   ========================= */
document.addEventListener(
    "touchend",
    event => {
        lastTouchEndTime =
            Date.now();
        if (
            touchStartedOnUI
        ) {
            lastTapTime =
                0;
            return;
        }
        /* =========================
           多指手勢結束
           ========================= */
        if (
            multiTouchGesture
        ) {
            if (
                event.touches.length ===
                0
            ) {
                multiTouchGesture =
                    false;
                pinchStartDistance =
                    0;
                pinchStartZoom =
                    zoom;
                clampOffsets();
                applyTransform();
            }
            lastTapTime =
                0;
            return;
        }
        const touch =
            event.changedTouches[0];
        const now =
            Date.now();
        const deltaX =
            touch.clientX -
            startX;
        const deltaY =
            touch.clientY -
            startY;
        const moved =
            Math.abs(deltaX) > 5 ||
            Math.abs(deltaY) > 5;
        /*
           雙 Tap 判斷必須在
           zoom !== 1 之前。
        */
        if (
            !moved
        ) {
            const timeSinceLastTap =
                now -
                lastTapTime;
            const distanceSinceLastTap =
                Math.hypot(
                    touch.clientX -
                    lastTapX,
                    touch.clientY -
                    lastTapY
                );
            if (
                timeSinceLastTap <
                TOUCH_DOUBLE_TAP_TIME &&
                distanceSinceLastTap <
                TOUCH_DOUBLE_TAP_DISTANCE
            ) {
                toggleZoom(
                    touch.clientX,
                    touch.clientY
                );
                lastTapTime =
                    0;
                return;
            }
            lastTapTime =
                now;
            lastTapX =
                touch.clientX;
            lastTapY =
                touch.clientY;
            setTimeout(
                () => {
                    if (
                        lastTapTime ===
                        now
                    ) {
                        toggleControls();
                    }
                },
                TOUCH_DOUBLE_TAP_TIME
            );
            return;
        }
        /* =========================
           放大狀態：
           移動絕對不翻頁
           ========================= */
        if (
            zoom !== 1
        ) {
            lastTapTime =
                0;
            return;
        }
        /* =========================
           1×：
           只有水平滑動才翻頁
           ========================= */
        if (
            moved
        ) {
            lastTapTime =
                0;
            if (
                Math.abs(deltaX) <
                TOUCH_SWIPE_THRESHOLD
            ) {
                return;
            }
            if (
                Math.abs(deltaX) <=
                Math.abs(deltaY)
            ) {
                return;
            }
            if (
                deltaX < 0
            ) {
                nextPage();
            } else {
                previousPage();
            }
            return;
        }
    }
);
/* =========================
   啟動
   ========================= */
findLatestNewspaper();
