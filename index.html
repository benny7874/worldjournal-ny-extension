<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="世界日報－紐約"><meta name="mobile-web-app-capable" content="yes"><title>世界日報－紐約</title>
<style>
html,body{margin:0;padding:0;background:#000;color:#fff;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}body{display:flex;flex-direction:column;align-items:center}#viewer{width:100%;height:100vh;overflow-x:auto;overflow-y:auto;position:relative;touch-action:pan-y;overscroll-behavior-x:none}#pageTrack{display:flex;width:max-content;height:100%;align-items:flex-start}#pageTrack>*{flex:0 0 100vw;width:100vw;display:flex;justify-content:center}#pageTrack img{display:block;width:auto;max-width:100vw;height:auto;min-height:1px;margin:0 auto;transform-origin:center center;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}#loading,#errorMessage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(30,30,30,.92);color:#fff;padding:12px 20px;border-radius:10px;z-index:100}#loading{display:none}#errorMessage{width:80%;max-width:400px;text-align:center;display:none}#controls{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:rgba(25,25,25,.92);box-shadow:0 4px 20px rgba(0,0,0,.5);backdrop-filter:blur(10px);white-space:nowrap}#controls.visible{display:flex}.controlButton{background:#333;color:#fff;border:0;border-radius:9px;padding:9px 13px;font-size:16px}.controlButton:active{background:#555}#pageNumber{min-width:70px;text-align:center;font-size:16px;cursor:pointer;user-select:none}#preloadStatus{min-width:78px;text-align:center;font-size:14px;color:#ddd}#datePanel,#pagePanel{position:fixed;left:50%;bottom:calc(75px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:none;width:min(90vw,360px);max-height:min(70vh,560px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(25,25,25,.96);border-radius:14px;padding:10px;box-shadow:0 4px 25px rgba(0,0,0,.6)}#datePanel.visible,#pagePanel.visible{display:block}.dateButton,.pageButton{display:block;width:100%;box-sizing:border-box;background:#333;color:#fff;border:0;border-radius:8px;padding:10px;margin:4px 0;font-size:15px;text-align:left}.dateButton.current,.pageButton.current{background:#555}#eventLog{position:fixed;left:4px;top:4px;z-index:9999;width:min(96vw,620px);max-height:48vh;overflow:hidden;padding:7px;background:rgba(0,0,0,.9);color:#0f0;font:10px/1.3 monospace;white-space:pre-wrap;pointer-events:none;border:1px solid #777;border-radius:4px}#diagVersion{position:fixed;right:6px;top:6px;z-index:10000;padding:4px 7px;background:rgba(0,0,0,.85);color:#ff0;font:11px monospace;border:1px solid #777;border-radius:4px;pointer-events:none}
</style>
</head>
<body>
<div id="viewer"><div id="pageTrack"></div></div><div id="loading">載入報紙…</div><div id="errorMessage"></div><div id="datePanel"></div><div id="pagePanel"></div><div id="eventLog">EVENT DIAGNOSTIC v1.0.0-DIAG</div><div id="diagVersion">v1.0.0-DIAG</div>
<div id="controls"><span id="preloadStatus">預載 0%</span><button class="controlButton" id="dateButton">09/22/2026</button><button class="controlButton" id="previousButton">‹</button><span id="pageNumber" role="button" tabindex="0">A01 / 40</span><button class="controlButton" id="nextButton">›</button></div>
<script>
const DAYS_TO_KEEP=7,DATA_URL="https://www.worldjournal.com/datafeed/wj/ny/NY-",SECTION_ORDER=["A","B","C","D"],PRELOAD_CONCURRENCY=4,TRACKPAD_SWIPE_THRESHOLD=80,TRACKPAD_WHEEL_RESET_TIME=180,TRACKPAD_DOUBLE_CLICK_TIME=350,TRACKPAD_DOUBLE_CLICK_DISTANCE=30;
let newspaperDate="",pages=[],currentPage=0,zoom=1,offsetX=0,offsetY=0,dragging=false,startX=0,startY=0,startOffsetX=0,startOffsetY=0,touchStartedOnUI=false,lastTapTime=0,lastTapX=0,lastTapY=0,controlsVisible=false,imageRetryUsed=false,preloadGeneration=0,preloadTotal=0,preloadCompleted=0,preloadFailed=0,preloadActive=0,trackpadWheelDeltaX=0,trackpadWheelTimer=null,trackpadWheelLocked=false,trackpadClickTimer=null,lastTrackpadClickTime=0,lastTrackpadClickX=0,lastTrackpadClickY=0;
const preloadSuccessCache=new Set(),$=id=>document.getElementById(id);
function formatDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function displayDate(s){let p=s.split("-");return`${+p[1]}/${+p[2]}`}function showLoading(v){$("loading").style.display=v?"block":"none"}function showError(m){$("errorMessage").textContent=m;$("errorMessage").style.display="block"}
function getSavedPage(d){let n=parseInt(localStorage.getItem(`worldjournal-page-${d}`),10);return Number.isNaN(n)||n<0?0:n}function saveCurrentPage(){if(newspaperDate)localStorage.setItem(`worldjournal-page-${newspaperDate}`,currentPage)}
function buildFallbackImageUrl(d,id){let x=d.replaceAll("-","");return`https://pgw.worldjournal.com/gw/wj.php?u=NY/${x}/NY${x}${id}`}function normalizeImageUrl(x){return typeof x==="string"?x.replace(/&size=S(?=&|$)/,""):""}
function updatePreloadStatus(g){if(g!==preloadGeneration)return;let s=$("preloadStatus"),n=preloadCompleted+preloadFailed,p=preloadTotal?Math.min(100,Math.round(n/preloadTotal*100)):0;s.textContent=`預載 ${p}%${preloadFailed&&n>=preloadTotal?`（${preloadFailed}失敗）`:""}`}
function preloadSingleImage(page,g){return new Promise(r=>{let a=page.imageUrl,b=page.fallbackImageUrl,done=0,i=new Image();i.referrerPolicy="no-referrer";i.onload=()=>{if(done)return;done=1;let k=`${newspaperDate}-${page.pageId}`;if(g===preloadGeneration){preloadSuccessCache.add(k);preloadCompleted++;updatePreloadStatus(g)}r(1)};i.onerror=()=>{if(done)return;if(!i._retry&&b&&b!==a){i._retry=1;i.src=b;return}done=1;if(g===preloadGeneration){preloadFailed++;updatePreloadStatus(g)}r(0)};i.src=a})}
function startPreloading(d,list){preloadGeneration++;let g=preloadGeneration;preloadTotal=list.length;preloadCompleted=preloadFailed=preloadActive=0;updatePreloadStatus(g);let q=list.slice(),ci=q.findIndex(x=>x.pageId===list[currentPage]?.pageId);if(ci>0)q.unshift(q.splice(ci,1)[0]);q=q.filter(x=>{let k=`${d}-${x.pageId}`,ok=preloadSuccessCache.has(k);if(ok)preloadCompleted++;return!ok});updatePreloadStatus(g);let ni=0;async function w(){while(ni<q.length){let p=q[ni++];preloadActive++;await preloadSingleImage(p,g);preloadActive--}}for(let i=0;i<Math.min(PRELOAD_CONCURRENCY,q.length);i++)w()}
async function loadNewspaper(d){showLoading(true);$("errorMessage").style.display="none";try{let r=await fetch(DATA_URL+d+".json",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let data=await r.json();if(!Array.isArray(data))throw Error("資料格式不正確");let f=data.filter(x=>typeof x.page_id==="string"&&/^[ABCD]\d{2}$/.test(x.page_id)).sort((a,b)=>a.page_id.localeCompare(b.page_id));if(!f.length)throw Error("這一天沒有 A/B/C/D 報紙");pages=f.map(x=>{let u=normalizeImageUrl(x.image_path);return{pageId:x.page_id,pageName:x.page_name||"",imageUrl:u||buildFallbackImageUrl(d,x.page_id),fallbackImageUrl:buildFallbackImageUrl(d,x.page_id)}});newspaperDate=d;currentPage=Math.min(getSavedPage(d),pages.length-1);buildDatePanel();buildPagePanel();showPage();updateDateButton();showLoading(false);startPreloading(d,pages);return true}catch(e){showLoading(false);console.log("World Journal API error:",e);return false}}
async function findLatestNewspaper(){let t=new Date();for(let i=0;i<DAYS_TO_KEEP;i++){let d=new Date(t);d.setDate(t.getDate()-i);if(await loadNewspaper(formatDate(d)))return true}showError("目前無法取得世界日報資料。");return false}
function applyTransform(){let i=$("pageTrack").querySelector("img");if(i)i.style.transform=`translate(${offsetX}px,${offsetY}px) scale(${zoom})`}function resetZoom(){zoom=1;offsetX=offsetY=0;applyTransform();resetTrackpadWheel()}
function showPage(){if(!pages.length)return;let track=$("pageTrack");track.innerHTML="";pages.forEach((p,i)=>{let box=document.createElement("div"),img=new Image;img.alt=p.pageId;img.draggable=false;img.referrerPolicy="no-referrer";img.src=p.imageUrl;img.onerror=()=>{if(!img._retry){img._retry=1;img.src=p.fallbackImageUrl}else showError("圖片載入失敗，請稍後再試。")};box.appendChild(img);track.appendChild(box)});track.style.transform=`translateX(${-currentPage*100}vw)`;$("pageNumber").textContent=`${pages[currentPage].pageId} / ${pages.length}`;resetZoom();updatePagePanelCurrent();window.scrollTo(0,0);saveCurrentPage()}
function nextPage(){if(zoom!==1||currentPage>=pages.length-1)return;currentPage++;showPage()}function previousPage(){if(zoom!==1||currentPage<=0)return;currentPage--;showPage()}
function toggleZoom(x,y){let v=$("viewer"),r=v.getBoundingClientRect();if(zoom===1){let a=x-r.left-r.width/2,b=y-r.top-r.height/2;offsetX=-a*.5;offsetY=-b*.5;zoom=1.5}else resetZoom();applyTransform()}
function isUI(t){return!!t?.closest?.("#controls,#datePanel,#pagePanel,#eventLog,#diagVersion")}
function handleTap(x,y){if(isUI(document.elementFromPoint(x,y)))return;let now=Date.now(),dx=x-lastTapX,dy=y-lastTapY;if(now-lastTapTime<350&&Math.hypot(dx,dy)<30){toggleZoom(x,y);lastTapTime=0;return}lastTapTime=now;lastTapX=x;lastTapY=y;if(zoom!==1)return;let w=innerWidth;x<w*.3?previousPage():x>w*.7?nextPage():toggleControls()}
function toggleControls(){controlsVisible=!controlsVisible;$("controls").classList.toggle("visible",controlsVisible);$("datePanel").classList.remove("visible");$("pagePanel").classList.remove("visible")}
function resetTrackpadWheel(){trackpadWheelDeltaX=0;clearTimeout(trackpadWheelTimer);trackpadWheelTimer=null;trackpadWheelLocked=false}
function wheelHandler(e){if(zoom!==1){if(e.ctrlKey||e.metaKey){e.preventDefault();zoom=Math.max(1,Math.min(3,zoom-e.deltaY*.01));applyTransform()}else{e.preventDefault();offsetX-=e.deltaX;offsetY-=e.deltaY;applyTransform()}return}if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>5){trackpadWheelDeltaX+=e.deltaX;if(Math.abs(trackpadWheelDeltaX)>=TRACKPAD_SWIPE_THRESHOLD&&!trackpadWheelLocked){trackpadWheelLocked=true;trackpadWheelDeltaX<0?nextPage():previousPage()}clearTimeout(trackpadWheelTimer);trackpadWheelTimer=setTimeout(resetTrackpadWheel,TRACKPAD_WHEEL_RESET_TIME)}}
function buildDatePanel(){let p=$("datePanel");p.innerHTML="";for(let i=0;i<DAYS_TO_KEEP;i++){let d=new Date(newspaperDate);d.setDate(d.getDate()-i);let s=formatDate(d),b=document.createElement("button");b.className="dateButton"+(s===newspaperDate?" current":"");b.textContent=displayDate(s);b.onclick=()=>{p.classList.remove("visible");loadNewspaper(s)};p.appendChild(b)}}
function buildPagePanel(){let p=$("pagePanel");p.innerHTML="";pages.forEach((x,i)=>{let b=document.createElement("button");b.className="pageButton";b.dataset.i=i;b.textContent=`${x.pageId} ${x.pageName}`;b.onclick=()=>{currentPage=i;p.classList.remove("visible");showPage()};p.appendChild(b)})}function updatePagePanelCurrent(){[...$("pagePanel").children].forEach((b,i)=>b.classList.toggle("current",i===currentPage))}function updateDateButton(){$("dateButton").textContent=displayDate(newspaperDate)}
$("viewer").addEventListener("click",e=>{if(e.detail===1)handleTap(e.clientX,e.clientY)});$("viewer").addEventListener("dblclick",e=>{toggleZoom(e.clientX,e.clientY)});$("viewer").addEventListener("wheel",wheelHandler,{passive:false});
let pinchStart=0,pinchZoom=1,lastDist=0;function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
$("viewer").addEventListener("touchstart",e=>{if(isUI(e.target))return;if(e.touches.length===2){lastDist=dist(e.touches[0],e.touches[1]);pinchStart=zoom;return}if(e.touches.length===1){dragging=true;startX=e.touches[0].clientX;startY=e.touches[0].clientY;startOffsetX=offsetX;startOffsetY=offsetY}});
$("viewer").addEventListener("touchmove",e=>{if(e.touches.length===2){e.preventDefault();zoom=Math.max(1,Math.min(3,pinchStart*dist(e.touches[0],e.touches[1])/lastDist));applyTransform();return}if(dragging&&zoom!==1){offsetX=startOffsetX+e.touches[0].clientX-startX;offsetY=startOffsetY+e.touches[0].clientY-startY;applyTransform()}},{passive:false});
$("viewer").addEventListener("touchend",e=>{if(e.touches.length)return;if(!dragging)return;dragging=false;let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(zoom===1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))dx<0?nextPage():previousPage();else if(Math.abs(dx)<20&&Math.abs(dy)<20)handleTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY)});
$("previousButton").onclick=previousPage;$("nextButton").onclick=nextPage;$("dateButton").onclick=()=>{$("datePanel").classList.toggle("visible");$("pagePanel").classList.remove("visible")};$("pageNumber").onclick=()=>{$("pagePanel").classList.toggle("visible");$("datePanel").classList.remove("visible")};
document.addEventListener("keydown",e=>{if(e.target.closest?.("#datePanel,#pagePanel"))return;if(e.key==="Escape"){resetZoom();$("datePanel").classList.remove("visible");$("pagePanel").classList.remove("visible")}},true);
const log=$("eventLog"),logs=[],noisy=new Set(["pointermove","mousemove","touchmove","wheel","scroll"]);let lastNoise=0;
function diag(e){let n=Date.now();if(noisy.has(e.type)&&n-lastNoise<120)return;lastNoise=n;let s=e.type;if(e.key)s+=` key=${e.key} code=${e.code||""} kc=${e.keyCode||0} rep=${!!e.repeat}`;if(e.button!=null)s+=` btn=${e.button} ptr=${e.pointerType||""}`;if(e.deltaX||e.deltaY)s+=` dx=${Math.round(e.deltaX)} dy=${Math.round(e.deltaY)}`;if(e.clientX!=null)s+=` xy=${Math.round(e.clientX)},${Math.round(e.clientY)}`;if(e.touches)s+=` touches=${e.touches.length}`;if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)s+=` mod=${e.ctrlKey?"C":""}${e.metaKey?"M":""}${e.shiftKey?"S":""}${e.altKey?"A":""}`;logs.unshift(new Date().toLocaleTimeString()+" "+s);logs.length>28&&logs.pop();log.textContent="EVENT DIAGNOSTIC v1.0.0-DIAG\n"+logs.join("\n")}
"keydown keyup keypress beforeinput input wheel mousewheel scroll pointerdown pointerup pointermove pointercancel pointerover pointerout pointerenter pointerleave mousedown mouseup mousemove click dblclick auxclick contextmenu touchstart touchmove touchend touchcancel focus blur focusin focusout visibilitychange compositionstart compositionupdate compositionend selectstart dragstart dragend gamepadconnected gamepaddisconnected".split(" ").forEach(t=>addEventListener(t,diag,{capture:true,passive:t!=="wheel"&&t!=="touchmove"}));
findLatestNewspaper();
</script>
</body>
</html>
